这个结论看起来非常奇怪。先不急着反驳。我说说我的看法和考虑，大家参考参考。

豪华油混（HEV）下文统一简称油混。

因为在魔都，不买车是最好的。平时地铁，有事打车，长途租车，是最快最方便的。

在魔都，开车出行是很可怕的。

首先是高峰期拥堵。

早高峰，07:30 – 09:30，峰值极值在 08:00 – 09:00。晚高峰17:00 – 19:30，峰值极值在 17:30 – 18:30。严重拥堵，延迟系数达 1.8 – 2.5，即通行时间为平峰期的 1.8 至 2.5 倍。

南北高架、延安高架、中环线、过江通道、内环高架，车速降至 15 – 25 km/h，平峰期为 60 – 80 km/h，极度拥堵路段甚至低于 10 km/h。如果遇阴雨天气或降雪，全城拥堵指数增加 30% – 50%，通行时间进一步延长。

上下班，地铁比开车快，这是百分百的。地铁上可以刷短视频，听音乐，还可以补觉。开车，堵车焦虑，路怒症，让人烦躁。

15公里的路程能开一个小时，脚踩刹车踩到抽筋，路怒症都要被逼出来了。车是蠕动的，蠕动到目的地。蠕动到目的地，找车位也很烦。核心商圈有地下停车场，很大，很绕，容易迷路。也很贵。

......
