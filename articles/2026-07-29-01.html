<body class="min-h-screen">

    <footer class="fixed bottom-0 left-0 w-full text-left pl-[30%] py-3 pr-8 text-sm text-gray-warm bg-cream/80 backdrop-blur">

    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '深度分析 | 疯狂才有机会跃迁';
        const CONTENT = `科技和博弈，让世界和人类越来越精于计算——算成本、算收益、算最优解，也越来越容易被预测。

**如果行为可以被预测，就容易被针对**，对手可以提前布局收割。

内卷、焦虑、35岁被优化。

**那未来怎么办？如何破局？如何跃迁？**

**疯狂**。

疯狂不可预测，难以收割。

反者道之动。

香港有个疯子，曾灶财，在街头写了50年字，没人理解，穷困潦倒，晚年，他的字开始拍卖，死后，一副字拍卖到40万，一架涂鸦电动车拍到180万，成为文化遗产。

亚马逊，1994年成立，直到2003年才实现年度盈利，连续亏了9年。

马斯克吹过的牛70%没实现，但市场给他2万亿美元估值。

这些人都个共同点：**疯狂**。

我写了一个详细分析，解读为什么未来只有足够疯狂才能实现阶层跃迁，全文五千八百字，星球见。

我是昆尼Kunniaa。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
