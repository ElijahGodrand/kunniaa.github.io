        const TITLE = '崩老登的马斯克';
        const CONTENT = `赚钱这个东西，是有逻辑的。是想清楚了，开始做之前，就知道必然赚钱，百分百赚。然后再动手。想清楚是一定的。想不清楚，睡不着，焦虑。想清楚了，再去做，后面是具体细节问题，可能很忙很累，不会焦虑，不会睡不着。就好比，你成绩很好，知道自己只要考试就是满分，肯定第一，但还是要考，一笔一划做题。

马斯克应该想过这些问题。他的结论就是，崩老登，当精神小妹。

马斯克最成功业务，先是特斯拉。然后是可回收火箭，星链。这几个业务有什么共同点？

传统车企一大堆老气横秋的家伙，供应链、经销商、工会、平台化节奏、安全认证，规矩厚得很。经销商网络、层层加价、保养售后和动力总成的复杂度上，造车本身成本没这么高。特斯拉用电动车切入，用直销、软件迭代、超级工厂和资本叙事，把旧汽车体系的一部分链条重新做了一遍。

火箭就是这样，各国政府和大承包商搞了几十年，成本加成、层层分包、怕失败、周期长、动作慢，整个行业老登气息浓郁。马斯克进去后自己造零件、快速试错、允许火箭炸、压成本、改迭代节奏，把旧体系掀了。

卫星，比火箭和汽车更典型。传统卫星行业就是老登把持的高门槛领域，政府和军工承包商主导，定制化、小批量、周期长、成本高、怕失败，一颗卫星像工艺品一样磨很久，发射机会也稀缺。老登气息比汽车和火箭还要大。

马斯克的星链不是按老规矩造精品卫星，而是把卫星变成批量工业品，用可回收火箭高频发射，用内部供应链压成本，用快速迭代容忍失败，把旧卫星体系那套慢、贵、少的逻辑崩掉。卫星制造、发射、组网、运营被他串成一条快节奏链条，

这三个行业，旧秩序越厚，老登越多，动作越慢，马斯克越能靠工程化、成本压缩和快速迭代打出缺口。火箭是这样，汽车是这样，卫星也是这样。

这三个领域是他做的最成功的领域，也是他商业价值变现最高的地方。

大模型反过来就说明问题，它不是老登领域，那是少壮派、巨头实验室、创业公司都在狂奔的新战场，人才密度、算力规模、产品迭代、生态入口，全都拼得极快。这个领域没有多少旧秩序等他慢慢崩，他入场不算早，组织节奏也不占优，所以他做得不成功。新领域不给他崩老登的时间，也不给他改造旧链条的空间，他那一套就不灵。

其他业务，也有崩老登的，也有不崩的。

The Boring Company也算是崩老登。传统隧道基建的老登是大型土木承包商、重型机械和层层分包的市政工程，成本高、速度慢、启动准备重。Boring Company的机器把目标定到每周掘进1英里、每英里综合成本低于500万美元，用连续掘进和全自动管片拼装把传统那套“开挖竖井、吊装、重型 civil 准备”的流程绕过去。

......

全文六千六百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
