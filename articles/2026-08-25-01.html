        const TITLE = '庚子一百八十六年祭：从真实宏观历史总结出的两条底层铁律';
        const CONTENT = `1840是庚子年，今年是2026丙午年。186年过去了。这将近两个世纪的跨度里，几十亿人出生，几十亿人死去，无数人在战火与饥荒中流离失所，无数人在制度与技术的更迭中被彻底重塑。

这186年，是试错成本极高的186年，是无数生命、财富、文化积累被反复投入熔炉的186年。投入如此巨大的历史成本之后，我们能否从这些充满血与火的记录中，提炼出一条真正底层的规则——一条能够以高精度预测未来走向、并据此指导行动以获得持续性成功的规则？

晚清风雨飘摇。从1840年鸦片战争开始，满清接连被打，打一次输一次，输一次签一个不平等条约，割块，赔款。西方的思想、宗教、技术、器物、军舰、传教士、商人、枪炮、领土要求，几乎同时涌进来。以前满清对外面的世界了解极少，除了少数商人，大部分人一辈子都没见过外国人，对海外的认知也十分有限。

蒸汽机、铁路、电报、火轮船、后膛枪、前膛炮，这些是看得见摸得着的。还有一些看不见摸不着的东西，比如议会制度、选举制度、宪法、人权、自由、平等这些观念，以及背后那一整套基督教伦理、法治传统、市民社会的运转方式。

当时几乎所有明白人都意识到一件事：满清这套老办法已经撑不住了。科举考出来的官员应付不了外交谈判，绿营兵扛不住列强的洋枪洋炮，朝廷的财政收入远远填不平战争赔款的窟窿。更危险的是，老百姓开始大规模造反，太平天国从广西打到南京，捻军在北方四处流窜，回乱在西北蔓延，清廷的统治权威已经大打折扣。

**旧模式肯定不行了，这一点没有争议。有争议的是下一个问题：既然旧的完了，新的从哪里来**？

中国几千年的传统是封闭的，天下大同，四海一家，华夏之外皆蛮夷。这种世界观建立在"中国是世界的中心"这个前提上，但在鸦片战争之后，这个前提已经被事实击碎了。外面的人不仅不比中国落后，反而在某些方面远比中国强大。

这意味着，如果还想活下去，不被瓜分、不被奴役，就必须向外面学，因为自己设计太慢，跟不上节奏。好比别人已经做出一道菜，配方成熟，口味被验证过，再从头发明这道菜毫无意义，而且浪费时间，合理的做法就是照着配方做，复刻。

如果不复刻，就一定会继续落后，落后就要挨打，挨打就要亡国。复刻是共识。复刻谁，复刻哪些，复刻到什么程度，有分歧。复刻的过程中，保留多少原版，这些问题在当时并没有人知道答案。

一个国家的制度、文化、信仰这些东西，没有办法写在一张纸上。它们是在漫长的历史里自然长出来的，和那个国家的地理、气候、人口、语言、宗教、外部环境缠绕在一起。拿走了配方，拿不走土壤，复刻不了生成成品的整个过程。

**第一次大规模复刻尝试，是从太平天国开始的**。1851年，广西桂平县金田村，洪秀全带着两万多人起事。这支队伍自称太平军，他们的口号并不复杂，拜上帝，斩妖邪，人人有饭吃。这个口号在当时看来，算不上新鲜，历代造反都是这么喊的，但洪秀全给这个旧口号裹了一层从没见过的糖衣。

他在广州参加科举考试时，在街头接到一份传单，上面写的是耶稣的故事。那本小册子叫《劝世良言》，内容七零八落，但洪秀全看进去了。他后来生了一场大病，病中梦见一个白胡子老人，对他说话，醒来后他认定自己就是上帝的次子，耶稣的弟弟，奉天命来人间斩妖除魔。这个梦改变了他的一生，也改变了半个中国的命运。

......

全文一万五千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;

            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
