    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '阿根廷，路径有限';
        const CONTENT = `三十年前，满大街都是音乐，音像店用大号音箱当街播放，无限循环。不管你想不想听，都能听到。仅仅逛街，就能听遍新歌，热歌。

现在不一样了，都有版权。14亿人，1.7亿音乐会员，其他12亿得放弃。

底层演员已经去跑外卖了，歌手也差不多了。歌手是打工人。版权在平台和唱片公司手里，歌手发不出声。

只要成本高了，音乐肯定是被放弃的。

成本高了，任何东西都会被放弃。养孩子的成本高了，也没人生了。大灾荒时代，食物成本太高了，命都可以放弃。

现代的文明不是什么高级的东西，高度商业化和资本化，把一切原本属于公共生活、自然繁衍的东西，全都明码标价了。当价格超过了大多数人的承受极限，大家集体躺平。

而且，价格必然会超过大多数人的承受极限，这样才能赚的更多。

什么是真正的文明？免费。免费越多，真正文明的程度越高。有人问，都免费，谁付费？生产力付费，谁生产力高，谁提供的免费的东西就越多。

免费图书馆、免费公园、免费音乐、免费基础教育，免费医疗。收费和变现不是文明。

繁荣的时代就是低成本，衰败的时代就是高成本。只要高成本，一切都会衰败，只要低成本，一切都会繁荣。

其他任何理由都是扯淡的。不要听政客胡说八道，不要听经济学家胡说八道。它们都是纯忽悠俊福的。它们也许懂一点，但是本质是坏种，不说真话的。

尽可能少收税，要尽可能鼓励充分竞争，这两个可以确保低成本。这两条，是现代经济学和制度经济学的灵魂。

......


全文五千九百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
