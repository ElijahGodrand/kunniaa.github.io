    <script>
        // ═══════════════════════════════════════=

        // ═══════════════════════════════════════=
        const TITLE = '家具行业，谁在赚钱？';
        const CONTENT = `家具行业这个概念，如果按照最严格的口径来界定，指的就是造家具的公司。沙发、床垫、软床、衣柜、橱柜、餐桌椅、实木床、茶几、电视柜，这些产品背后的制造和销售。

它不是装修，装修是施工服务，是另一条赛道；它也不是卖场，卖场是收租金的流通渠道，自己不生产任何一件家具；它更不是涂料板材，那些是家具的上游原材料。

把装修公司、家居卖场和建材企业全部剔除之后，家具行业剩下的就是一批把木头、皮布、海绵和五金变成一件件家用家具，然后卖给消费者的制造企业。

需要先说明的是，这个行业有很多没有上市的公司，体量很大，但因为不公开财报，拿不到精确的营收、净利润和净利率数据，所以本文的分析只覆盖有公开数据可查的公司。

比如某某家居，它是民用家具行业里体量最大的非上市公司之一，2024年营收在不同口径下大约在65亿元到180亿元之间，是功能沙发第一梯队玩家，2025年天猫双11成交破亿。这类公司无法纳入精确的盈利能力排序，但它们的存在本身说明，行业里还有一批不上市但体量很大的隐形巨头，数据不透明，不代表市场份额和渠道能力可以忽略。

这个行业的体量不算小。2025年，全国规模以上家具制造业实现营业收入6125.1亿元，利润总额328.1亿元。但这两个数字本身就在讲一个不太乐观的故事：**营收同比下降了10.7%，利润总额同比下降了12.1%，利润的降幅还略大于营收的降幅。这意味着行业不仅在收缩，而且收缩的过程中赚钱变得更难了**。全年规模以上家具制造企业的数量大约在7467家，营业收入利润率只有4.4%左右。这是一个平均净利率不到5%的行业。

......

行业还**极度分散**。欧睿国际的数据显示，2025年中国家居用品市场没有任何一家公司的份额超过2%，前三名合计只占5%左右。家具出口额在2025年同比下滑了3.5%，上游木材加工和木、竹、藤、棕、草制品业的利润总额同比暴跌了38.3%。上游在亏钱，出口大盘在收缩，中游制造企业的盈利压力从两头挤过来。这些背景数据说明，2025年家具行业的盈利分化不是偶然的，而是整个产业链利润重新分配的结果。

......

真正值得拆解的，是某某家居为什么能把净利率做到25.38%，以及为什么某某、某某、某某这些规模更大的公司反而做不到。

......

把这些公司放在一起，几条普遍的规律就变得清晰了。

第一条规律，也是最重要的一条：**赶上某一个品类的升级换代，比什么都重要。** 沙发正在经历从“固定”到“功能”、从“手动”到“电动”的升级。

......

第二条规律：**出海是必须的，但“怎么出海”决定了你能不能赚到钱。** 

......

第三条规律：**垂直一体化在制造业里永远是利润的护城河。** 某某自己做电机、电控和机构件......

......

**在一个平均净利率不到5%的行业里，能做到25%净利率的公司，不是因为它做的东西更高级，而是因为它的利润没有被渠道、被上游、被费用结构分走。**

......

全文七千六百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
