    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '先说京歌是什么。';
        const CONTENT = `我是观众。观众的权利，就是先不管你们怎么定义，我先听，听完再说舒服不舒服。我不是研究者，也不打算给这个体裁下学术定义。

京歌这个东西，按我自己的耳朵理解，就是把京剧里最抓人的那点声腔韵味、旋律片段、咬字润腔，提出来，放进一首现代歌曲的结构里。

它首先是一首歌，有主歌副歌，有起承转合；但它借了京剧的皮和腔，所以一耳朵有戏味。

京歌把京剧里那些“硬”的、“快”的、有门槛的、推进剧情的东西滤掉，只留下悦耳的、迂回的、容易被大众耳朵接住的那一层。所以很多人听京歌会觉得“有京剧的感觉，但比京剧听着舒服”。这是京歌的设计目标。

它不是京剧，它是歌。这个区别很重要，因为京剧是戏，京歌是歌。戏要推进冲突、塑造人物、完成叙事，歌只需要好听、耐听、能让人反复听。

京歌是“戏歌”的一支，八十年代末《故乡是北京》广泛流传，基本确立了这种体裁。姚明、阎肃这些艺术家，把京剧声腔和现代歌曲写法接在一起，上晚会可以，上收音机也可以。

后来京歌越来越多地依附于电视剧主题曲、大型晚会、主题创作，它的功能性也越来越强。

坏就坏在功能性。功能性强到一定程度，词就开始替别的东西说话，拔高，不自然，这是听下来最不舒服的地方。

我的标准很简单：词不能搞代言，不能强行拔高，不能语体打架，不能腔词互背。好的和坏的最好能切得开，留下一段干净的。

曲和腔可以高级，京胡可以苍劲，二黄可以迂回，但如果词一落笔就带着那套“恶心的玩意”，那就得扣分。

**第一名，我给《重整河山待后生》**。这首歌严格说更偏京韵大鼓，不是最典型的京歌，但按词的标准，它该坐第一。

“千里刀光影，仇恨燃九城。月圆之夜人不归，花香之地无和平。一腔无声血，万缕慈母情。为雪国耻身先去，重整河山待后生。”

自然，没有拔高，没有代言。词、腔、唱三者合一。排第一没有任何犹豫。

......

全文五千四百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
