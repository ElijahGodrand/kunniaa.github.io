    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '哲学 | 世界是恶心的？萨特的描述和齐泽克的证明';
        const CONTENT = `萨特“觉得”世界恶心。齐泽克“证明”世界恶心。

“证明”比“觉得”，多了一套**可以拿来用的工具**。

读了那么多书，听了那么多道理，是不是依然觉得：
- 明明知道老板在画饼，却还是加班到深夜？
- 明明知道奢侈品是符号消费，却还是觉得背它出去有底气？
- 明明知道政治是表演，却还是愤怒、期待、失望、再愤怒？

齐泽克管这叫**“犬儒主义意识形态”**：什么都看穿了，但照演不误。而且，正因为看穿了，反而觉得自己“清醒”，可以心安理得地继续演下去。

**知道世界是恶心的，不是为了让人绝望，而是为了让人不再被“假装不恶心”的人收割。**

全文七千六百字。**识别“崇高客体”**，那些“拼命追求但永远得不到”的东西，本身就是空的。**掌握“视差之见”**，不再被任何单一立场绑架，左派右派、甲方乙方、伴侣父母，看到的是“对立背后的裂缝”。破解“自由选择”的幻象**，以为在选，其实选择标准早被预设好了，看穿就更的自由了。

星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
