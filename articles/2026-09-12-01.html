    <script>
        // ═══════════════════════════════════════=

        const TITLE = '到处募捐的慈善基金，富豪的家族基金，都是怎么回事？';
        const CONTENT = `今天聊的东西，可以让你未来节省几百块几千块。

国外，有很多向公众募捐的慈善基金，也有富豪年龄大了把自己财产捐给家族基金，有时候两类之间也有一些PY关系，合作搞一些项目，共同站台一些仪式。它们在形式上非常有迷惑性，有很酷炫的光环，似乎很让人仰慕。

......

这个结论是错的。并不是国外的富豪就是好人，他们跟国内的一样，没有差别。他们把钱放进基金会，不是因为高尚，而是因为这件事对他们非常有利。这里面的逻辑一层一层往下扒，会发现他们精明得很。

第一个逻辑，跟基督教有关。基督教里有一句话，出自《马太福音》第19章第24节，耶稣对门徒说的：“我又告诉你们，骆驼穿过针的眼，比财主进神的国还容易呢。”同样的记载也出现在《路加福音》第18章第25节。这句话从基督教诞生到现在，一直没有被反对过，因为这条策略对宗教太有利了。

......

所以在中世纪，教会非常有钱，极度有钱。教会的土地曾经占到欧洲总数的五分之一，而且这些土地多半来自王公贵族的捐赠。有钱之后就搞出很多乱七八糟的事，比如有一部文学经典叫《十日谈》，就记载了教会干的那些很好玩的事情。薄伽丘在这本书里写了大量讽刺教士贪财、纵欲、伪善的故事，其中超过60%的故事涉及教士或修女，绝大多数是以讽刺甚至丑化的方式呈现的。有一则故事甚至直接引用教皇的话说：“若非教会收入依赖赎罪券，我宁可让所有灵魂下地狱。”那个精彩程度，相当于中世纪的草榴社区。

......

**但是圣经里那条“富人上天堂难”的话并没有改。想上天堂，死的时候还得是穷人。** 这就出现了一个巨大的矛盾：新教鼓励疯狂赚钱，但圣经说有钱人进不了天堂。怎么办？

所以这些富豪就发明了一种方式：我在临死之前把财产捐出去，成立一个基金会。这个基金会名义上是公众所有，但是关键职位让我的儿子、女儿、孙子、孙女，让我的家人来担任关键职位拿高薪。这样他们就相当于获得了一种很好的保障，而且永远是我的家族人来做管理者。**通过这种方式，他既保留了财富，又能上天堂，而且让后代得到很好的照顾。这实际上就是钻宗教的空子，钻上帝的空子。** 上帝看到这个也无可奈何，只好让他们上天堂。因为按照字面意思，他死的时候确实没钱了，钱都在基金会里。

......

还有一种基金会，它是向公众筹集善款的。

......

本质上，这套东西的底层逻辑和赎罪券是一模一样的。**先告诉你，有罪——过得比那些穷人好，不捐款就是冷漠、没有同情心。然后告诉你，捐钱可以赎罪——捐了款，就变成了一个好人。** 

......
那么我们再设想一个场景：假如在一个地方，权力是高度集中的，也没有宗教焦虑，也没有稳定的信用，这三个条件都很重要。在这种情况下，任何基金、任何慈善都是不必要的。**在这种情况下，如果有人搞这种慈善，搞这种基金，大概就两个目的。第一，要么是他要建立起自己的私有权力体系，这个是极度危险的，肯定不会有什么好果子。第二，就是他想搞一点钱，为自己活得更舒服，这种可能性倒是更大。** 没有其他可能。如果一个人真的想干好事，不会使用这种两方式，因为这两种方式都不对。

......

人之所以会上当，本质上就是没有做好分类。有一个人骗了你，你可能会想，是因为他是异性，因为他说话好听，因为他装得惨，所以我上当了。那么学习到的经验就是：如果有一个异性装作很有礼貌，表达得很惨，他就是在骗我的钱。但下一次，骗子可能用其他要素组合，甚至每一次都发明一个新的花招，以前从来没有出现过的骗局。所以总是有人会上当。

......

这也就是我们经常看到很多成功的人，实际上非常冷漠的原因。他就是没时间去调查真相。他就是总结出来所有人都是骗子，他也不想去看。他对这个事情不感兴趣，他也不想去看怎么自证、怎么证明自己没有骗。他既不想去调查，也不看的证明材料，他就一律拒绝。

......

全文六千四百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
