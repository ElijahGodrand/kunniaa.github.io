        const TITLE = '珠宝行业，谁在赚钱？';
        const CONTENT = `珠宝行业是个大盘子，黄金、翡翠、钻石、白银、珍珠、彩色宝石都算在内。

2025年中国珠宝首饰行业市场规模达到9780亿元，同比增长25.58%，创下历史新高。**黄金产品市场规模约7600亿元，占整个珠宝市场的77.7%**，份额最大，**得黄金者得天下**。玉石约1000亿元，占比10.2%。钻石产品约480亿元，占比4.9%。彩宝252亿元，占比2.6%。珍珠230亿元，占比2.4%。铂金62亿元，占比0.6%。白银56亿元，占比0.6%。

玉石是第二大类，高端翡翠价格在2025年还坚挺上行，中低端产品价格稳定或有所回落。它是一个有真实需求的品类，只是**非标、信任成本高、很难规模化，很难做成品牌连锁**。小玩家在玉石领域做私域、做寄卖、做直播清货，是有活路的。

钻石的情况比较复杂。2025年钻石市场规模增长了11.6%至480亿元，一般贸易项下成品天然钻石进口额增长65%。增长主要来自3克拉以上的大钻石，这类产品价格仅微跌0.4%，代表财富象征的高端需求依然存在。**真正崩掉的是0.3到0.5克拉的日常消费级钻石**，2025年全年跌幅超过20%。十年前花1.8万元买的钻戒，如今回收价只有180元，贬值率99%。培育钻石1克拉零售价从2020年的约8000元跌到3500元，中国培育钻石产量占全球63%，毛坯出口增幅高达161.1%。**钻石行业不是整体在死，而是“大克拉收藏级”和“小克拉消费级”在加速分裂**。小克拉的消费级钻石，正在被培育钻和黄金双重挤压。

**利润在向大品牌集中，小品牌几乎赚不到钱。**

......

最刺眼的是某某黄金，698亿元的营收，只换来2.75亿元的利润。它主要卖投资金条，按克计价，金价越透明，利润越薄。**大品牌里做材料生意的利润微薄**。

黄金饰品有两种“按克计价产品”和“定价产品”。

按克计价产品的价格公式是：当日金价 × 克重 + 工费。比如今天金价 600 元/克，一个手镯 20 克，工费 2000 元，总价就是 14000 元。金价每天变，价格每天跟着变，消费者自己能算清楚。

定价产品，通俗讲就是“一口价”产品**。它和“按克计价产品”相对，直接标一个总价，按件卖，不按当天金价拆开算，比如同一个手镯，品牌直接标 18000 元，不说克重，或者虽然标签上有克重，但销售时强调“这是一口价”。它的调价由品牌决定，通常几个月调一次，不每天跟金价波动。消费者付的钱里，除了黄金原料，还包括设计、工艺、品牌溢价。

**真正赚到钱的大品牌，共同点是从“卖黄金材料”转向了“卖黄金品牌” ，做定价产品**。

......

**珠宝行业的钱在哪里**？

第一，**必须赚最有钱人的钱**。这条至关重要。某某黄金的黑金卡会员只占客户总数的10%到15%，却贡献约七成销售额，这批人年消费普遍超过50万元......

......

全文六千一百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
