    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '深度分析 | 世界为什么变成现在这个样子？';
        const CONTENT = `各国的国债持续增长，街边店铺贴着“转让”，年轻人投出几百份简历没有回音，育儿成本高到离谱，生育率持续下跌，每个人都觉得自己在拼命，但每个人都在被替代的边缘。世界像一个巨大的迷宫，所有的路都通向同一个死胡同。世界怎么变成这个鬼样子？

这篇深度长文，从荒岛上的鲁滨逊讲起，一步步推演到现代经济的主结构。

你会看到：

为什么国家必须不断借债？为什么普通人生孩子是必然趋势？为什么一个人的资产永远是另一个人的负债？为什么努力工作，却感觉越来越穷？为什么这场博弈的终点，可能是人类自己在被系统“优化”掉？

不是鸡汤，用简洁的逻辑，拆解债务、竞争、人口、剥削、生存策略。

读完会知道：世界为什么变成这样，普通人还能做什么。

全文八千九百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
