        const CONTENT = `2026年无锡高三期中语文考试，阅读理解材料是粟裕1948年《华东野战军淮海战役攻击命令》。

大规模群体管理，难在哪里？

第一，所有人都要知道总目标。

第二，有极其详细的清晰权责边界与人岗地匹配。每个人知道自己应该在哪、负责什么。明确任务区、责任主体和交接规则。

第三，全覆盖与接合部兜底。不能有真空，交界处最易出事。只划边界不够，边界之间会有缝隙。必须保证空间、任务、风险都有责任主体，尤其接合部要有兜底规则。

第四，分层指挥与参谋作业。主官定原则，参谋定细节，基层守边界。

第五，弹性调度与预备力量。边界管常态，程序管例外。情况永远在变，边界不能僵死。要保留预备，规定越界、转用、支援的条件和批准程序。

第六，信息标准化与个体认知降载。每个人只需记住关键规则。大规模系统的效率，取决于能否把复杂全局转化为每个单元的简单指令。个体接口必须简单。

作战命令是一手史料，是粟裕当年写给各兵团的部署：哪个兵团从哪个渡口渡江、登陆后向哪挺进、在什么条件下届时另有命令转用兵力。

这个命令是节选，已经非常复杂了。

命令中涉及的部队番号众多，核心是华东野战军的主力纵队，同时也对中原野战军的行动作出了安排。由华野本部指挥的，1纵、6纵、9纵、鲁中南纵队、特纵主力。在阻击和打援部署中提到的，第7、第10、第11纵队。中原野战军（陈邓所部）的1、3、4、9等纵队，在徐州以西、以南地区发起攻势，以钳制邱清泉、孙元良兵团，配合华野主力作战。

命令的作战区域围绕徐州，覆盖了广阔的淮海地区。以徐州为中心，东起海州、西止商丘、北起临城、南达淮河的广大地区。作战焦点是新安镇、阿湖地区，目标是围歼驻扎在此的黄百韬兵团。为保障围歼作战，命令还规划了广阔的阻援区域。比如要求部队在徐州以东的侯集、林佟山至大许家地域进行正面防御，阻击徐州方向可能东援的国民党军。

复杂性很大程度上是针对渡江后必然出现的混乱风险而设计的。渡江不只是冲过江面，更危险的是过江之后：敌情不明、渡口拥堵、电台中断、敌军可能从南京、镇江、苏州、无锡等多个方向抽身南窜。任何一个环节的协同失灵，都可能让合围的网口漏人。

因此命令反复使用确实控制、坚决堵击、打通联系、堵塞南窜道路这类措辞。一个兵团不能只知道自己冲，还必须知道旁边谁堵、后面谁接、敌人东援谁来打、南逃谁封口。

以七兵团的段落为例，它在极短的篇幅内同时锁定了多个维度。从极阳镇（不含）至姚沟（含）渡江，渡口细化到凤凰颈、土桥、六百丈等具体点位。登陆后第一步是向南岸上下游横扫，策应中野与九兵团；达成后，以不超过一个军割歼特定区域之敌，主力则向东挺进至指定地域集结待机。未来接口：写入届时另有命令才执行抢占杭州中正桥等后续动作。
