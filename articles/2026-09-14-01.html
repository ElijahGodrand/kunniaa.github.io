    <script>

        const TITLE = '演员，惨烈的行业';
        const CONTENT = `最近看了一些数据和调研，如果数据和调研是真的，那演员这个行业很惨烈，可能比码农还惨。学表演可能不如学计算机，机械，自动化。

先看顶级的学校。中戏北影上戏中传的表演系，录取率极低，一两百人录取一个，即使考上了，大多数人也一生跑龙套的。比如北影，每届两三个班，每班二三十个学生，总共也就是几十号人。每个班，能考上北京人艺，上海话剧艺术中心的撑死一两个。拍戏当主演的一两个。其他的如果一直拍戏，也就是在各个剧组当特约演员，没有固定角色，跑龙套，背景板，一个月收入6000到12000左右，但是不能保证一年12个月都能进组。

特约演员是什么？比如夏洛特烦恼里面夏洛问路的大爷，马什么梅，什么冬梅，马冬什么，陪夏洛他妈打麻将的几个大妈。《潜伏》里的盛乡。《亮剑》里的大佐黑岛森田。有几句词或者没有词，活几分钟，阶段性出现，不对剧情产生推进作用，一天三百到五百。

大部分人收入只够维持生活。有些转行做自媒体，有的在艺术培训机构教表演。还有大约三分之一毕业后彻底放弃了演艺事业，做别的去了。

表演系能混出头的，基本上都是还没毕业就就拍戏了，如果上学时没有接到戏，最多延迟到毕业两年了，如果还没什么机会，基本上这辈子就不可能出名了。

这个圈子里，骗子很多，表演系还没入学就有经纪公司排着队签学生，全都是骗子公司，签了就等着倒血霉吧，就三种可能，赔钱解约，打官司，雪藏，把家里榨干为止，坑到家破人亡，人家就是吃这个饭的。

拍戏比建筑工人还苦。建筑工人好歹有上下班，下雨天还能休息。剧组一开工，休息那就是个奢侈品。一拍电视剧电影几个月的时间别想休息一天，每天至少工作14小时起步。反正只能8小时休息时间，还包含来回路程。工作14小时也是休息八小时，工作24小时也是休息八小时。连续拍了两天两夜都常事。剧组里几乎无论男女，大部分都是烟鬼，没办法，见天这么熬夜，不抽烟那顶不住，进了剧组连抽带发一天三包打不住。

导演好不到哪里去，徐克拍七剑，传说七天七夜不睡觉，没那么多，是连续三四天不睡觉。

......

这是一个导演写的：
“冬天最冷的时候，凌晨，穿一件单衣拍4个小时的雨戏”

“在茶卡盐湖泡了三天，每天从早上6点过泡到晚上8、9点，支架轨道全部被腐蚀损坏，裤子上全是盐，晚上把裤子脱下来，硬邦邦的可以完全自己立在地上。雨靴不够，穿拖鞋在盐水里腌着，一天下来脚跟火在烧一样。”

......

摄影师写的：“剧组的工作强度，996都是小意思。都是持续几个月的007！每天晚上10点就能收工的剧组，几年也遇不到一个。”

这不是人过的日子。

剧组夫妻真不是个事，压力那么大，总要有个泄压的方式。

......

全文六千一百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
