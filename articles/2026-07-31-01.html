    <script>

        const TITLE = '精英教育 | 精英教育的内核：精确描述事实';
        const CONTENT = `欧洲经历过长期战争，第一次百年战争，第二次百年战争，布尔战争，法国宗教战争，三十年战争，路易十四的战争，拿破仑战争，法国殖民战争，普鲁士的崛起战争，德意志统一战争，两次世界大战...

欧洲长期处于你死我活的生存竞争中，在这种环境下，信息失真就意味着战败。斥候的军情报告如果模糊，统帅会做出错误判断；航海日志如果不精确，整支舰队可能在海上渴死。不精确会完蛋。几百年打下来，欧洲被迫形成了一种刻进基因的共识——精确描述事实，是存活的第一要件。

所以欧洲的真正的精英教育非常残酷。法国预科，第一年就能淘汰掉五分之一的学生；在德国，一旦论文被认定抄袭，连国防部长、教育部长的博士学位都会被直接撤销；在英国牛津剑桥，考试作弊或者论文抄袭的处罚只有两个字——开除。没有任何商量余地。粗心大意导致的引用不规范、数据记录不准确，同样会被严厉处罚。

这种趋势在世界范围继续扩散。因为囚徒困境和人的本性，使得权力世界向交易世界进行深刻转变。靠忽悠、靠模糊来获取利益的空间，正在缩小；靠交换、靠竞争、靠信任来创造价值的空间，持续扩大。精确描述事实不再是可选项，而是生存的底线。

全文八千四百字，从历史、哲学、社会演变和博弈论的多重视角，深入拆解了这条规律的形成逻辑和运作机制，并给出了具体的训练下一代的方法，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
