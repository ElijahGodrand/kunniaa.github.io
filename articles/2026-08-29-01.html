    <script>

        const TITLE = '血腥残忍的汉初一百一十五年';
        const CONTENT = `从刘邦称帝到汉武帝死亡，一共一百一十五年，这段历史极其重要，有两个原因。

第一个原因，它非常之血腥残忍，极度无情。如果你看懂了这段历史，那么你对人生中遇到的任何事情都不会感到惊讶和难过，你会对未来可能遇到的事情都能做好充分的心理准备，无比平静，宛如穿越。

很多人喜欢陀思妥耶夫斯基，把他的小说捧上天。

《罪与罚》，写一个穷大学生拉斯柯尼科夫，杀了一个放高利贷的老太婆，又杀了她的妹妹。然后呢？整本书就是他的痛苦、他的疑神疑鬼、他的内心自我怀疑。他觉得自己是“超人”，杀一个“虱子”一样的老太婆是为了练胆，结果杀了之后惶惶不可终日。全篇都是他的煎熬。

《卡拉马佐夫兄弟》写一桩弑父案。一个贪婪好色的老地主被杀了，他的几个儿子——德米特里、伊凡、阿廖沙——陷入了复杂的冲突。整部书都在探讨信仰、理性、自由意志、人性的复杂。

有人说这是“深入灵魂”。有人说这是“人类精神的高峰”。有人说陀思妥耶夫斯基“在描写人类所受的苦难方面是无与伦比的”。

**就这？这算啥玩意？**

一个大学生，杀了一个放高利贷的老太婆。一个儿子，杀了自己贪婪的父亲。这就叫“深入灵魂”了？这就叫“人类的苦难”了？

**杀一个放高利贷的人，或者杀一个已经活了大半辈子、干尽坏事的人——这算什么罪恶？这算什么痛苦？**

跟汉初比起来，**沧海一粟，九牛一毛，若一毫置于太虚，似一滴投于巨壑，完全不值一提。**

第二个原因，这段历史在后来的各个朝代都是一遍一遍地重复的——从汉到三国，到隋唐，到宋元明清。规则、趋势、结构一模一样，只是力度有所差别，有的时候强一点，有的时候弱一点，但趋势没有任何差别。只要精通这段历史，你对未来一切都可以做精准的预测，毫不夸张，就是精准的预测。

刘邦的前半生是游侠，混迹市井。后半生，随着他打下的领土越来越多，这个人就变了，极其奸诈狡猾，又象世界末日一样疯狂玩命。《让子弹飞》马邦德在电影开头对他的评价——刘邦是个小人。

“小人”这个评价对他来说已经有点抬举了。他比小人恶劣多了，他是电影《极度深寒》里的海底怪物**奥物瓦类（Octalus）**，既有章鱼的触手，又有水蛭的吸血习性，口器如同海葵长满利齿，身体还带有**强腐蚀性液体**，极其恶心，捕食**不咀嚼，而是整个吞下后活活吸干骨髓和体液，最后吐出白骨**，电影有个**女人被从马桶里伸出的触手拖走**，非常血腥，是无数人的心理阴影。这种怪物有**狡诈的智慧**，体型恐怖，会躲藏伏击，普通的**枪械和火焰对它无效**，这也很象刘邦。

刘邦跟项羽打仗的那些事儿，咱们先不谈。最重要的一个节点在于，他跟项羽达成了“楚河汉界”的协议，双方罢兵。项羽信守承诺，把他的老婆、父亲、孩子都还给了他。但是刘邦转头就听从张良和陈平的建议，**立刻撕毁协议，发兵猛攻项羽**，把项羽灭了。

此后所有人都确认了：**刘邦是个完全没有信用的人，说翻脸就翻脸**。人人自危。

......

全文五千两百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
