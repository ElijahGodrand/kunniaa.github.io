    <script>

        const TITLE = '人创造上帝';
        const CONTENT = `站在月球看地球，聊一个人类重要的问题：宗教。内容很长，这是站在唯物博弈论的立场，对人类这个问题进行分析。

全球80亿人，有神论者，62~70亿人。无神论者大概不到二十亿，集中在某些特定地区。严格无神论者1.79%，很少。从源头，以宗教创始人的视角，研究宗教是如何一步步被创造出来的，如何统治人类。

宗教是人类文明的母鸡，下了无数个金蛋，比如：

**契约与信用**。社会契约、宪法、条约、商业合同、银行信用、保险。

**法律与司法**。西方法庭、律师、程序正义、衡平法、国际法。

......

大约在四千多年前，美索不达米亚平原上生活着苏美尔人。他们用楔形文字刻下了一段故事：诸神开会决定用洪水毁灭人类，因为人类太吵闹了。一个名叫乌特拿比什提姆的人得到神的警告，造了一艘船，带着家人和各种动物逃过一劫。这个故事被刻在泥板上，后来被巴比伦人继承，写进了《吉尔伽美什史诗》。

......

**在自然主义和历史批判的框架内，宗教可以完全被理解为人造的文化-社会现象；圣经是古代近东素材、以色列民族记忆、祭司文士编辑、政治神学建构的产物；它的核心功能之一是建构民族认同、统一人群、合法化秩序。研究到文本形成和社会功能这一层，历史学和社会学的任务就基本完成了。再往后，是哲学和神学的领域，不是经验科学能终结的。**

一句话：  **宗教是人造的，不是神启的；是历史中形成的，不是永恒不变的；是社会建构的，不是超自然给定的。**

......

它们共享同一套抽象逻辑：**危机与需求 + 可用资源 + 合法性叙事 + 组织制度 + 边界敌人 + 传承机制**。

......

全文一万三千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
