    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '加速主义';
        const CONTENT = `在现实世界，碰到一个庞大、坚硬、油盐不进的系统，比如公司，比如团队，比如什么什么鬼东西，正面硬刚刚不过，建议改进压根不听，这时候该怎么办？

有一群脑洞大开的人提出了一个完全反直觉的思路：既然正面打不过，也劝不动，那就别反对了，咱们干脆**顺着它的意思来，甚至帮它踩死油门**，把它原本那套荒谬的逻辑推到极致，让它在最短的时间里撞墙、挂彩、彻底解体。这就是加速主义最原始、最疯狂的核心本质。

**这个策略，可以让一个人在系统内平步青云，又能实现真正意图，双赢，赢两次**。

这套理论最早追溯到1848 年。

那一年，...... 

完全不按套路出牌，他公开表示支持自由贸易... 自由贸易越狂飙突进，旧的...消亡得就越快，....矛盾就会被推到最顶峰。说白了，这就叫**越坏越好**，......这堪称是人类历史上最早、最地道的加速主义。

到了 20 世纪 70 年代，法国的后结构主义哲学家德勒兹和瓜塔里，在他们的名著《反俄狄浦斯》里，又给这套思想加了一把火。当时这帮左翼哲学家郁闷坏了，他们发现系统简直就是个变形金刚，太能消解反抗了。批判它、抗议它，写书骂它，...转头就能把这些批判和抗议包装成商品，卖给那些愤怒的年轻人，反而赚很多钱。面对这种死局，德勒兹提出了一个极其震撼的反问：既然逃跑和原地抗议都没用，那为什么不走得更远？为什么不**加速这一进程**？

......

到了20 世纪 90 年代，英国华威大学成立了一个名字听起来像科幻小说里的组织，叫做网络文化研究单元，简称 CCRU。这帮人在英国华威大学的地下室里日夜狂欢，把赛博朋克、科幻小说、大陆哲学和早期互联网狂潮熔于一炉，把加速主义推向了高潮。后来，这帮人内部也分家了，裂变成了两大阵营，也就是后来大家经常听到的**右翼加速主义**和**左翼加速主义**。

......

全文七千八百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
