    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '历史漫谈 | 为什么各国的债务不可能消失，还会越来越大？';
        const CONTENT = `主权决断和国家间竞争，使得各国债务永久膨胀，绝不可能消失。

国债是主权国家的心跳。

三千年历史反复验证：从梭伦的解负令到西班牙哈布斯堡王朝的四次违约，从法国大革命的财政崩溃到希腊债务危机的漫长折磨，没有任何国家真正摆脱过国债——它只会被推迟、被稀释、被重置。

小国如摩纳哥、文莱可以近乎无债，其生存依赖外部庇护或不可复制的资源禀赋。

对任何一个正常规模的现代主权实体而言，国债不是选择，而是宿命。

**一切投资、一切政策判断、一切资产配置的关键行为，都必须建立在“国债永远不可能消失，只会被转移和重置”这条铁律之上**。

主权违约是周期性的制度特征。通胀是稀释债务的标准操作。财政紧缩与货币宽松的交替是债务螺旋的内生节奏。

真正的安全边际只有一个：识别债务周期所处的位置，判断主权决断的下一次干预方向，在重置之前布局实物资产、跨境配置或硬通货，在被稀释之前锁定长期付息能力。

全文五千四百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
