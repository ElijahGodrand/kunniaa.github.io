    <script>

        const TITLE = '精英教育 | 牛津剑桥成立后之后的数百年是纯粹的垃圾，它们是怎么翻身的？';
        const CONTENT = `牛津、剑桥在成立后的数百年不是学术殿堂，是暴力街区。

14世纪，牛津的人均谋杀率是伦敦的4到5倍。75%的凶杀案凶手是大学师生。学生佩剑带弓，酗酒斗殴，嫖娼杀人，靠“神职人员特权”逃避刑罚。学校不教科学，只教空洞的拉丁语语法和神学辩论。直到19世纪，剑桥的学位还被叫作“Poll degree”——希腊语“乌合之众”的意思。连学生们自己都知道这个学位不值钱。

同时期中国的州县学和太学呢？有统一教材，有标准考试，有国家财政支持，有完整的奖惩体系。两者根本不在一个维度上。

那么，今天的牛津剑桥为什么又成了世界顶尖？

两个原因。

第一，被军校逼的。1741年成立的伍尔维奇皇家军事学院，培养的是“完美的工程师”和“优秀的炮兵军官”。入学要考试，毕业要考试，考不过就淘汰。在这所军校里，“精确”第一次成了硬性标准。正是这所军校，用100多年的实战成果，倒逼牛津剑桥在1854年后全面改革，引入科学课程、确立考试制度、建立实验室。

第二，靠边缘人翻身的。牛顿在剑桥时，主流课程是经院哲学，他自己看笛卡尔、做实验、搞推导。胡克在牛津时，混进一个科学小圈子，跟着波义耳做助手。几百年来，真正改变这两所学校的，从来不是课堂上的主流，而是那些自学成才、小圈子里碰撞出来的异类。

那么，我们能从这段荒诞史里总结出什么？至少有六条有价值的东西：死撑名字的意义、招纳边缘人的重要性、外部压力的催化作用...

无论你现在经营的是什么——一个品牌、一个项目、一个社群、人生——参考这个公式，大概率也会成功。

全文九千三百字，详列时间线、历史证据、人物细节，以及一套完整的经营逆袭公式，一次性看透一套游戏规则，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        });
