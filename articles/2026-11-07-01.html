        const TITLE = '法官霍尔顿化';
        const CONTENT = `《血色子午线》不是一本传统意义上好看的小说，第一次读的人会觉得怪，生理不适。

传统小说有清晰的主线、起因。这本书没有。它是一场漫长的、没有终点的噩梦。

主角孩子（The Kid），身材瘦小、体格单薄，14岁离家出走，加入了格兰顿帮，经历了无数次与印第安人的血腥遭遇战、帮派间的火拼。他学会了在极其恶劣的环境中生存，熟练掌握枪械和刀具。他像一个没有感情的摄像机镜头，带着读者从东走到西，今天遇到一群印第安人剥头皮，明天遇到一伙强盗火拼，后天在荒漠里找水。故事的推进不靠逻辑，靠的是无尽的流浪和暴力。这种结构让人感到极其疲惫和虚无。

文体非常怪诞，没有引号，书里所有人说话都没有双引号，也不标明是谁在说话，对话和叙述完全混在一起，必须反复读几遍才能分清是谁在开口。

书里用了大量极其生僻的植物、地理、古英语词汇，像史诗一样去写一段泥泞里的杀戮。白描冷血残酷，开膛破肚、婴儿被挂在树上、剥皮抽筋。没有怜悯，没有愤怒，没有心理活动，极其压抑。

小说没有好人。主角会毫不犹豫地开枪杀人、参与剥头皮。法官霍尔顿（Judge Holden）是个变态杀人狂，精通多国语言、懂科学、懂哲学的学者。他身高两米，像一头白化病的大猩猩，力大无穷，不吃不喝不睡也能在沙漠里走上几天几夜，能一边拉小提琴一边发表关于战争是永恒的游戏的哲学演讲。

书里没有救赎，没有正义，只有谁今天活下来了。

小说结尾也没有给读者任何安慰。它说，人类不过是荒原上一群无意义的打洞者，文明不过是虚伪的掩饰，暴力才是宇宙的终极法则。

这本书为什么被奉为神作？

因为它怪到了极致，就变成了一种极其独特的暴力美学和历史隐喻。把读者带到了美国西部扩张的最黑暗、最真实、最血淋淋的深渊，探讨人类本性中的恶、战争的必然性，以及宇宙的绝对冷漠。

《血色子午线》全书最高潮、也是最令人毛骨悚然的场景，主角孩子步入中年，在茅房里被法官霍尔顿干掉的现场。

*他顺着木板路走向茅房。他站在外面，听着那些声音渐渐远去，他又看了一眼那些星星在暗沉的山丘上空消亡时留下的寂静轨迹。然后他推开茅房粗糙的木板门，走了进去。法官正坐在茅坑上。他赤身裸体，微笑着站起来，张开双臂将他搂进自己那巨大而可怕的肉体里，并在身后插上了木门闩。*

作者没有写法官杀了他，而是写法官微笑着站起来，张开双臂将他搂进自己那巨大而可怕的肉体里（gathered him in his arms against his immense and terrible flesh）。

这是动物之间的猎杀。

熊捕食人类，用双臂抓着人往自己怀里拖，熊的臂力极其恐怖，一旦抱住，立刻压断人类肋骨，胸腔挤压无法呼吸，然后撕咬。雄狮捕食野牛，也是抓着脖子，咬住野牛的喉咙，把整个身体贴挂在野牛身上，直到把野牛咬死，也一动不动挂着。

主角被法官用这种熊抱勒住，胸腔瞬间被压扁，肺里的空气被全部挤出，气管闭塞，只能发出微弱的闷哼，甚至失声。这就解释了为什么外面狂欢的人、撒尿的人，没有任何人听到求救声。压制住之后，法官可以撕咬或瞬间捏碎颈椎，在密闭的茅房里只需几秒钟就能完成终结。

在《血色子午线》中，法官常被解读为诺斯替主义（Gnosticism）中的巨匠造物（Demiurge），一个盲目、残忍、吞噬一切的神。主角被搂进巨大而可怕的肉体，隐喻了人类血肉之躯最终被这个冷酷的物质世界、被暴力的宿命所吞噬。法官的肉体就是这片大地的终极现实，沉重、恶心、无法逃避。在这个拥抱里，没有灵魂的升华，只有肉体的毁灭。

......

全文一万字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
