        const TITLE = '大学的未来';
        const CONTENT = `视频被投诉下架了。我感到非常气愤。所以变化一下写作风格。看看是不是能好点。哈哈。

大学未来的主要方向是赚钱，老师们要会搞钱。

国家出台新质生产力的政策，申请一个项目，申请时就得说清楚这东西将来怎么变成产品、怎么落地、卖给谁。验收阶段，重点考核落地应用实绩，纸面成果不算数，得看有没有真被用、真产生效益。

教育部等六部门改革薪酬制度，年薪制、协议工资、项目工资。

同济取消长聘之后，其他跟进的高校，对经费的要求已经非常具体。

......

每下愈况，民办学校也在升级，西安一家民办二本，不同职称的教师，每年要完成横向经费到账，四万五到十万不等，学院给文学院下的是五年七百万的到账指标。苏北一家公办本科的文科讲师，摊到的任务是接下来三年每年五到七万横向到账，完不成绩效和职称都受影响。

把这些放一起看，就是一个统一的动作，把老师从领工资的人，改成能自己挣到钱的人。

这些改变都指向钱，到账经费和转化收入，而且是现金，是从市场、从企业、从真实需求那里赚回来的钱。

只有会搞钱，去大学当老师才会稳一点。**先会搞钱，才有工作机会**。

大学老师擅长理论，理论其实是好解决。凡是"有唯一正确答案、能写成书、能一步步推导"的东西，都属于理论，都属于成本低、学得快的那一层。

大模型出现以后，这一层的获取成本几乎被压到了零。

......

那么再提供一个就是相对简洁啊，更容易成功的路径其实也很简单，就是你看你看你就是搞这个东西，就是你对哪个哪个东西有兴趣，你就去学那个东西，在学的过程中，你就把你所有学的东西，学的过程，做文档，做视频，做教程，把它全发出来，你发的这个过程你能不能获得机会取决于你创造这个东西有没有价值，如果你创造这个东西有价值，那么你就相当于是一个谁个扔在地上的一个金戒指或者扔在地上的一个提包，提包里装了1万块钱，肯定会有人捡走。

如果没人找你，证明你创造价值不够大，如果你学习过程发视频，发PDF，发预测，发判断，发代码，嗯，把你做的东西你创造出了价值了，那么自然就会有人找你，价值越高，找你的人越越多，会给你提供机会，提供钱，他会要求你入伙，会给你股份，这是非常简单的事情，如果你没搞到钱，唯一的理由就是你创造价值不够。

......

全文五千字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;

            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
