        const TITLE = '纯净水日常运营成本极高，财务状况很糟糕';
        const CONTENT = `本文纯属虚构，如有雷同，纯属巧合。

所有内容来互联网公开资料，根据公开资料和行业数据进行推断，只保证数量级正确。

......

纯净水的工作室注册在宁波高新区，这是出于合法合规的税务规划考量——当地对影视文化企业有税收优惠政策，可以降低税负。她真正的办公地点在北京，而且必须是北京核心地段的高端写字楼。这跟避税无关，跟“排面”有关。品牌方、投资方来拜访，看到的是办公室的位置和装修，这直接决定了他们对明星的估值。没有排面，就谈不到好合作。

纯净水的工作室大致是300平米左右的办公空间。这个面积是刚需——除了常规的办公区，还需要独立的化妆间、服装间（存放活动礼服和造型用品）、会议室（接待品牌方和制片方）、以及一个简易的拍摄区域（用于新媒体内容的快速产出）。这些功能分区堆在一起，300平米是底线。早几年更大，2018年纯净水的办公室在万达某层，一个大整层全归她，面积通常在 **1360㎡至1950㎡** 之间。

成本相当高。北京CBD甲级写字楼2025年平均月租金约为每平方米210元。300平米的月租金约6.3万元。物业费按国贸区域标准，约每平米30到60元不等，取中间值45元，物业费约1.35万元。车位按3个固定车位算，CBD月租约1500元每个，合计4500元。仅办公室的硬成本，每月就超过8万元。

纯净水身边需要养一个精干但完整的团队。贴身助理至少2人，负责行程、杂务和生活照料；专职司机1人；保镖1人；执行经纪人1人，负责对接项目和商务；宣传人员1人，全职负责新媒体运营和舆情维护。财务可以兼职，法务可以外包，不需要养全职。这样算下来，核心团队是7个人。

工资这块，助理月薪约8000到9000元，两人1.6万；司机8000元；保镖是重头戏，普通三线艺人配备两名护卫每月支出就要6到8万元，纯净水这个级别一个保镖4万月薪是保守估计；经纪人2.5万；宣传1.5万。工资合计约10.4万元。再加上北京单位五险一金缴纳比例约38.9%，约4万元。人力成本每月约15万元。

办公室硬成本8万加上人力成本15万，每月固定支出约23万。再加上日常办公耗材、水电、网络、保洁、绿植等杂项，每月25万是底线。**纯净水哪怕一整年不接任何工作、没有任何收入，每个月也要先掏出25万来维持这个摊子。一年就是300万**。这就是她“一动不动”的固定成本。

再计算她的豪宅... ...

......

这就是她面临的第一个残酷现实：**不管赚不赚钱，每年至少要花掉1200万**。

......


四年累计税后进入工作室的收入，约6300万到9900万。

**但请注意，这只是进入工作室的营收**，每年至少1200万的刚性支出要从这里面扣。扣完之后，四年累计盈余大约在1000万到3000万之间。平均下来，每年能存下来的钱大概250万到750万。

考虑到她还有个人消费、父母家庭消费以及计划外开支，每年应在数百万级别，那每年能存下来的钱可能更少一些。

这就是她面临的第二个残酷现实：**过去四年，她几乎没有积累**。

......

**这就是“纯纯的负资产”**。曾经的“人间富贵花”，如今正面临着她职业生涯中最严酷的寒冬。纯净水应该没读过《包法利夫人》。

......

全文五千七百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
