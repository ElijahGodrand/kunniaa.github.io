        const CONTENT = `雷哥相亲记，账号巅峰粉丝数接近200万，总点赞接近3000万，属婚恋赛道头部博主。

2026年9月19日前后，该账号发布停更退网公告，本人陈述原因为常年遭受互联网谣言困扰、长期熬夜焦虑，2025年检查确诊抑郁症，决定暂停直播与运营。

退网并非单纯健康原因。2024年起，一名孙姓女网红持续在网上公开辱骂、诽谤雷哥。雷哥起诉后，某院判决双方互相道歉。雷哥按法官提供的文案录制并发布道歉视频，视频随即被对方以投诉方式下架。

此后他陷入反复发布道歉视频、反复被举报下架的循环，账号一度被封禁，本人称“我是退网不是落网，我想休息但是别人不让我退”，连退网声明也遭举报下架。

看来，道歉很难完成了？其实不然，也好解决。雷哥案的具体判决确实指定了抖音平台。他其实可以申请，更换平台。

赔礼道歉的履行方式，核心原则是影响范围相当，不用死守某一个平台。

法律也有了替代路径：如果义务人拒不履行，某院可以采取公告或公布裁判文书等方式执行。这意味着，“必须在抖音”并不是法律上的绝对要求，只是判决在正常情况下选择的一种与侵权影响范围相匹配的具体方式。

雷哥面临的情况，法律上叫客观履行不能。如果原定履行渠道因客观原因无法使用（例如原微信群解散），义务人采取传播范围相当的等效方式履行，可以认定已履行完毕。

雷哥在抖音上每一次发布都被投诉下架，这个渠道事实上已经被堵死了。他可以主张抖音平台已构成客观履行障碍，申请某院允许他通过其他等效途径（例如另一个社交平台、某院公告等）来完成道歉义务。

这种变更，**必须由他向执行某院提出申请**，主张抖音渠道已被对方的持续投诉实质性阻断，请求某院准许替代履行或由某院以公告方式代为履行。

但他恰恰没这么做。他一直在被动地“被要求重发”。公开可查的报道和讨论中，未见雷哥向执行某院提交变更履行方式申请的记录。

如果雷哥没有主动申请变更履行方式，**那么这个行为本身就是一个选择，而选择暴露偏好**。

他没有走这一步，等于搞一个循环，这个循环有流量有效果：每一次某院要求他继续履行，为他固定“我照做了”；每一次对方投诉下架，为他制造“我道歉了但对方不让”的冲突；每一次平台下架，都是“投诉通道可以被单方面武器化”的；退网声明被下架，把“连退出都被阻止”的受害者叙事推到顶点；限制高消费和抑郁症陈述，让“惨”有了可验证细节。

他是受害者。**黑归黑，惨归惨，但热度在每一轮循环里完成一次累积**。受害者叙事，可以大幅度提升商业变现。

......
