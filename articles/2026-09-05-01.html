    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可

        const TITLE = '大镰刀的财富思维模式来源于11岁围棋冲段失败';
        const CONTENT = `介绍大镰刀的文章，通常都会提到一句，“9岁独自去武汉学围棋，三年后冲段失败”，然后回家继续上学。

字少事大。不了解定段难度的人，不知道这句话的可怕。

定段赛是职业围棋的入场券。中国围棋协会自1962年成立至今六十余年，只产生过1000多名职业棋手。大多数人终其一生都摸不到职业的门槛。每年参加定段赛大约500人，成功定段的只有二三十人，成功率不到5%。

零起点学习围棋，三年冲段成功，迄今为止没人能做到。而且，围棋启蒙要早，大镰刀9岁学棋已经晚了。

**一代天骄常昊，6岁学棋，9岁8个月定段成功，用时约3年8个月**，这个纪录至今无人能破。

**杨鼎新，5岁始学棋，9岁9个月定段，用时约4年4个月**。

**吕政颐，5岁4个月开始学习，10岁定段，用时约5年**。

**杨千逸，5岁学棋，10岁定段，用时约5年**。

这些都是天才。

**战鹰**，跨圈围棋大V，6岁学棋，半年后省赛第六，定段举步维艰，八年，冲段八次，19岁成功，外号“八定王”，定段就是这么残酷！

......

大镰刀小时候学围棋的那个决策，其实是欠考虑的。9岁的孩子产生了一个天真的向往，父母竟然同意了，三年后失败回家，家散了。

......

对于孩子来说，**事实不重要，感受才重要**。他感受到了“因为做了一个决定，所以一切都毁了”。这个感受刻进了灵魂里，变成了他此后所有行为的地基。他后来的一切——拍午餐、买香蕉、上太空、写小作文...都是在对一个不可能被修复的过去做无用的补偿。

这种归罪感在他的言行中留下了清晰的痕迹。**最明显的一个证据是：他几乎一辈子不谈围棋**。一个在围棋上投入了三年时间的人，后来在所有公开场合都回避这个话题，这种沉默本身就是一种信号——话题太痛了。如果学围棋只是一段普通的失败经历，他大可以轻松地调侃几句；但他选择的是封存。那三年不仅没有给他带来荣誉，还带走了他的家。每一次提到围棋，都是在提醒他，是你自己要去的。

......

由此，可以得到一个更普适的结论：**如果一个人在做重大决策时呈现出极端的小心、周密、反复推演、不放过任何细节、总在预设失败场景，那么几乎可以确定，他以前在某个重大决策上吃过巨大的亏。**

......

全文五千五百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
