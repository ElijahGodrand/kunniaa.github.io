        const TITLE = '为何人类永远痛苦';
        const CONTENT = `人和人，如果有共识，不会痛苦。就好比两个小偷，要偷东西，一个人眼神过去，另一个人就知道要干啥，马上操作。这就是共识。这就是心有灵犀一点通。这种感觉是非常好的。

但如果没有共识，很痛苦。比如婚姻，两个人如果没有共识，从小事到大事，每个事情都能吵一遍，非常可怕，形同陌路，同床异梦。

但共识一定会破坏，后面会讲为什么破坏。这是一个圆，是循环的。所以总要从一个点开始。

共识的破坏，我们说它的结果，共识的破坏，其结果就是所有美德都消失了。比如说勤奋，忠诚，信用，契约。

那么从博弈的角度来说，一旦一种美德开始变弱，那么对于博弈的个体来说，因为它是囚徒困境，他应该立刻抛弃这个美德，而不应该等大家都抛弃了他才抛弃。那就慢了。

反过来当一个美德开始萌芽，那要比任何人都更坚持这种美德，要求更高更强。

共识的建立本质上是巨大的成本。一个新朝代的建立需要极其巨大的成本，钱和生命。一种共识体系的崩塌也会带来巨大的成本，也是钱和生命。

我们可以达成一个关于共识的共识，只要巨大的成本投下去，一定会产生效果，一定会产生某种共识。即使是错误的，也可以达成。

达成共识的方式，霍布斯的方式就是绝对暴力。更确切地说，就是成本，巨大的成本。而成本就意味着苦难。所以没有苦难就没有共识。

反过来，任何巨大的苦难都会在一定的时间达成共识。苦难一定会让幸存者达成共识。

但是由于人是生物体，有变化，所以又会忘记。

人的大脑，人的身体，是快速变化的东西，想记住共识，只有持续的苦难才行，所以我们得出一个结论就是人一定会长期承受苦难，永远承受苦难，原因就是这是他的生理特征，这是生物质本身的特征决定的。

人的生命很短暂，不超过一百年。下一代，没有亲身经历过达成共识的那些痛苦，那些巨大的痛苦，就会忘掉这种共识。所以人类就会一遍一遍的经受苦难，以便重新达成共识。

这也就是黑格尔说的，“人类唯一从历史中吸取的教训，就是人类从不吸取教训”，这条也经常被人遗忘。

《历史的教训》这本书说，“历史教训之一：人们从未从历史中汲取教训。”

所以我们得到结论就是，人类必然永远的无穷无尽的承受痛苦。因为人类是生物体，生物体不能永远牢记共识，生物体会变化，不能牢记共识。生物体会死亡对共识，而对巨大的痛苦会遗忘。所以人类会一代一代承受痛苦，不但如此，人类在人生的每一个阶段，也会承受痛苦。

人类如果想避免现实痛苦，只有一种方式，就是把承受痛苦的真实状态记下来......

......

全文五千四百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;

            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
