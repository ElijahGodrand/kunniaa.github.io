        const TITLE = '法国已是母系社会（全文）';
        const CONTENT = `**法国有一个有意思的法律，禁止丈夫在私下进行亲子鉴定。这个法律必将导致婚姻解体，必将导致法兰西民族灭亡**。

婚姻不是爱情的产物，而是私有制的产物。在人类漫长的蒙昧时期，并不存在现代意义上的婚姻制度。这是恩格斯在《家庭、私有制和国家的起源》的结论，也是学术界认可的结论。

他们的义务是铁定的，他们的权利是悬空的。

答案极其简单。规避风险。不结婚。不结婚，就没有法定的父亲推定，就可以在很大程度上避免为别人的孩子承担责任。

另一方面，非婚生子的比例不断攀升，在很多欧洲国家，这一比例已经超过了一半。这意味着社会在实质上正在回归“只知其母，不知其父”的状态。出生证明上父亲一栏空白，已经成为一种普遍现象。孩子由母亲和国家共同抚养，父亲的角色被彻底边缘化，变成一个可选项，而不是必选项。

**这正是母系社会的核心特征：血缘的传递只通过母亲完成，父亲的地位是附着的、不确定的、可以被剥离的**。

远古的母系社会是什么样子，以前大家不知道，现在大家知道了，就是法国目前的样子。

现代福利国家，通过税收再分配和法律强制抚养费，已经替代了氏族部落中母舅和宗族的角色，承担起了抚养下一代的主要经济责任。而男性，则在失去资产继承权和后代确认权的双重打击下，逐渐退出了家庭的核心舞台，沦为国家福利机器的燃料提供者，以及基因库中的随机贡献者。

劲爆的来了。

既然男性已经看清了这场博弈的底牌，法国人可能会选择“跟别人的老婆生孩子”就变成了一种在制度缝隙中生存的理性策略。

这句话听起来很诡异，然而，在纯逻辑的推演中，它有着完整的闭环。与其把自己绑定在一段高风险的法律关系里，不如选择不承担法律义务的生育方式。

他只需要贡献基因，而把抚养的责任留给母亲和国家，因为国家的福利系统已经在某种程度上代行了这个职能。

在这种策略下，男性获得了生物意义上的延续，却逃脱了法律和经济意义上的责任。

这种路径的普及，最终会彻底瓦解婚姻作为一种社会制度的信誉和效用。当越来越多的男性选择这种“无责任生育”模式，婚姻就会变成一个只有女性才渴望进入的牢笼，以及少数看不清形势的男性的陷阱。

届时，婚姻制度将名存实亡，父系的血脉传递将彻底让位于母系的抚养体系。

我们可以沿着这个逻辑继续往下推演，看看这个母系社会的现代版最终会长成什么样子。

首先，单亲家庭将成为主流抚养单位。孩子和母亲一起生活，父亲要么缺席，要么偶尔来访，经济上由国家福利和母亲的收入共同支撑。男性的角色被压缩为基因提供者和部分税金的贡献者，他们在孩子的成长过程中不再具有不可替代的地位。

其次，姓氏的传递将失去意义。既然财产已经无法大量继承，既然血缘已经无法被确认，姓氏作为父系传承的符号，将变得越来越空洞，最终可能演变为一种纯粹的个人选择，甚至被抛弃。

再次，社会伦理将发生根本转向。忠贞的概念将被重新定义，因为忠贞原本服务于确认血脉的需要，而一旦确认血脉的机制失效，忠贞对于男性的价值就会大幅下降。婚姻中的忠诚问题，将从一个“财产欺诈”问题，降格为一个“情感偏好”问题。

最后，国家对个人的控制将全面深入福利的毛细血管。当家庭这个中间结构被削弱，国家就成为直接面对每一个公民的最终管理者。母亲和孩子从国家领取福利，男性从国家接受税收账单，所有人的身份都变成了国家数据库里的一个编号。

**整个逻辑链到这里已经完整闭合**。起始端是私有制催生了父系婚姻，中端是福利国家用税收瓦解了私有财产的继承意义，转折端是法律禁止确认亲子关系，终点端是男性理性退出婚姻，导致社会结构向母系回归。这整个链条环环相扣，每一个节点都是上一层逻辑的自然延伸，没有跳跃，没有强加。

传统的幸福叙事——结婚、生子、积累财富、传给后代——已经在这套逻辑链条中打碎。

注意，当趋势不可更改，世界大势，浩浩荡荡，顺之者昌，逆之者亡。所谓顺之者，就是加速主义。你的最优策略，就是拿答案，直接操作。就像考试，大家还在辛苦地算结果，你已经看到结果了，选择题，填空题，你就直接写答案。你就比别人领先20年，30年，50年，100年。

为什么可以领先100年？因为我们还会推导出100年后的答案，更重要的东西。接着往下谈。

**那法国为什么敢出台这样的法律？不怕法国男性翻脸吗？还真不怕**。

因为法国的税收很高，高到可怕的程度，税收占GDP的比例高达44.6%，几乎一半的GDP都被收走了。这意味着，每个男性创造的价值，有接近一半不属于自己了，私有财产近半被抢走。

当一个国家的公共支出占到GDP接近一半，当税收渗透到每一笔收入、每一次消费、每一次资产转移中时，私有财产的概念就已经发生了质变。

你辛辛苦苦积累的财富，在你还在世时就已经被国家以福利的名义切走了相当大的一块。你缴纳的养老保险，供养的是别人的父母；你缴纳的医疗保险，支付的是陌生人的手术费。到了你离世时，你能够名正言顺、毫无损耗地传给后代的资产，已经大打折扣。

国家用一套庞大的再分配系统，把“私有财产”悄悄转化成了“公共池子”。在这个池子里，个人对资产的绝对控制权被稀释了。

既然你的财产被抢走近半，那么你留给你后代的财产也被抢走近半。继承，这个概念的重要性，也就消失了一半。亲生后代的重要性也消失一半。

也就是说，对于法国男性来说，孩子是不是自己的，只要有一半概率是自己的就行。所以，也就接受了不准私下做亲子鉴定的法律。

既然财产已经不再是纯粹个人的，那用来确保财产准确传递的婚姻制度，自然也就失去了它最核心的存在理由。

婚姻在福利国家的制度下，正在从“资产继承的保险箱”蜕变为“福利分配的端口”。它不再首要服务于确认血脉，而是服务于国家管理人口、分配福利、降低社会治理成本的行政工具。

对法国这个国家而言，孩子是谁生的不重要了，只要是法国人就行，只要是法国人，那就从小享受福利待遇，享受从GDP汲取的接近一半的税收带来的福利。

国家更关心的是：这个孩子出生后，能不能有一个法定的父亲来分担抚养成本，能不能有一个稳定的家庭单元来消化社会风险，能不能在法律的层面上锁定一个“责任人”来为孩子的成长兜底。

至于这个责任人是不是生物学意义上的父亲，在国家的大账本上，这是一个可以忽略不计的细节。所以，国家通过立法，强行掐断了私人确认血缘的通道。这在法律层面是强制将“生物父亲”转变为“社会父亲”，在逻辑层面则是宣告了父权制核心关切的彻底贬值。

从这个角度也能理解，为什么法国zf只要宣布加税或者延迟退休或者削减退休福利，巴黎街头就会爆发持续游行和冲突，马克龙被抽耳光。因为税收实在太可怕了。换谁去了都要抽马克龙耳光。

法国的婚姻已经瓦解了，大多数人不结婚。只接受PACS协议。一男一女签订PACS协议一起生活，直到女性年龄过大，失去生育能力，两个人再补个结婚手续。

马克龙娶了个已经失去生育的女人，也是个不错的选择。不担心绿帽问题。

法国男人，在优雅的外表和浪漫的甜言蜜语之下，有理性的大脑，并不傻。

**那法国为什么能收这么高的税收**？

高税收能不能成立，根本不取决于福利理念多先进，而取决于一件事：**抽走这笔钱之后，大多数人还能不能活下去。** 

只要能勉强活下去，大多数普通人就不会选择造反。造反成本极高，收益极不确定，只要日子还能过，低风险偏好就会占上风。税收的极限，本质上就是这条“税后生存线”。

生产力进步的意义，正在这里。二战前做不到高税收，不是因为当时的人不懂福利，而是因为生产力剩余太少。农业社会里，抽走一半，农民真的会饿死。饿死的人不会交税，活下来的人会拼命。国家强行抽，结果就是暴动、逃亡、生产崩溃，最后税也收不上来。

战后工业化完成，一个农民能养活几十个人，社会剩余巨大，国家才有可能抽走接近一半，而多数人税后还能维持基本生活。这才是高税收的真正前提。

福利在这个逻辑里，确实不是第一位的。它更像是一种**返还和收买**。国家把钱抽上去，再通过医疗、教育、养老、失业金返还一部分，让被抽走的人觉得“我还得到了东西”，从而降低反抗意愿。

福利当然有稳定作用，但它的本质是花别人的钱，效率必然低下。花别人的钱比花自己的钱浪费得多。所以福利不是高税收的原因，而是高税收能够持续的政治包装。

还要加上两个辅助条件。

第一是**财政幻觉**：税不一次性收，而是藏在工资单、社保、增值税、消费税里，普通人感觉不到自己总共交了一半。如果让每个人每年直接写一张支票给国家，看到自己一半收入被拿走，早就出大乱子了。

第二是**债务**：当税收不够维持福利时，国家就借未来的钱。法国公共债务超过GDP的110%，就是用后代的钱维持当下的生存线。债务暂时不击穿生存线，但把崩溃推后，并且放大。

**“饿不死”是社会可接受的最低生存线。** 在现代社会，这条线包括住房、医疗、教育、基本消费。如果福利削减到只够吃面包，黄马甲就会上街。所以税收的上限不是固定比例，而是**生产力剩余减去社会可接受生存线之后的余额**。

生产力增长快，余额大，税可以高；生产力停滞，老龄化加剧，纳税者减少，领取者增多，余额缩小，税就收不上去了。

把这个逻辑接到高福利国家的结局上，链条就完整了。

高税收的极限是大多数人还能勉强活；福利是次要的收买工具；生产力进步让这条极限变得便宜，所以法国能收44%。 

**这就得到一个更强的结论：生产力越提升，税收比例越高，最终还是只给大多数人留下勉强维生的东西。当税收到高到一定程度，大多数人的财富聊胜于无，也就是说，大多数人都是国家的临时工**。当下几乎没有私产，且未来的私产也通过债务方式提前被人汲取，就是临时工。大多数法国人都是法国的临时工。

从这个角度看，现代社会确实在走向一种全民奴隶化的新形态。

公民这个概念，从一开始就不是“住在某地的人”，而是**有财产、有权利、有义务、能参与决定共同体命运的人**。古典公民是战士，是纳税人，是主权者。他保卫国家，因为国家是他的。他参与决策，因为财产是他的。他承担义务，因为权利是他的。

现代人名义上有投票权，但财产被税收抽走大半，决策权被官僚系统和技术治理取代，劳动成果被资本和国家的双重渠道分流。依赖国家提供医疗、教育、养老，所以不敢反抗。依赖工作获取收入，但收入被税收、通胀、房贷、消费贷层层切割。依赖消费主义获得满足，但消费又被税收和债务绑定。剩下的只够维持基本生活，无法积累足够的资产来获得真正的独立。

名义上是自由人，实际上是国家的纳税人、资本的打工者、权力的管理对象。三重枷锁套在身上，你不再是公民，你是功能组件。

**所以，公民消失了**。

只有**纳税编号**，一个**福利领取者**，一个**被管理的对象**。他是一个租客，一个客户，一个系统里的功能组件。

由这样的人组成的国家，自然也不再是公民共同体。它保留着国旗、国歌、宪法、议会、选举，保留着所有国家的符号和仪式，但这些都变成了空壳。

真实的运作逻辑已经变成：**国家提供公共服务，居民缴纳管理费。** 国家提供安全、道路、学校、医疗、养老金，居民用税收和合规来交换。国家不再需要公民的忠诚，只需要客户的配合。客户不再需要热爱国家，只需要依赖服务。

于是国家概念实质上已经死了。它退化成一家**垄断性的公共服务公司**。这家公司的合法性不再来自“我们人民”，而来自“系统还能运转”。一旦运转失灵，忠诚不会出现，只会出现逃离、罢工、抗议和替代。

**这个结论似乎相当悲观，但现实确实就这么演化的。证据就是，二战后，法国的税收占GDP的比例确实是逐渐升高的。生产力提升，直接带动税收比例提升**。

从1950年至1985年，法国的税收收入占国民收入的比重，从1950年的**20.6%**，一路攀升至1985年的**44.5%**，翻了一倍还多。

1980之后，税收占GDP的比例进入了一个高位平台期，法国的税收占GDP比例在2000年为**43.7%**，2024年为**43.5%**，2017年期间最高达到46.2%。

法国公共支出占GDP的比例，呈现出一条清晰的、台阶式的上升曲线：
1947年：40.8%
1975年：43.4%
2000年：51.4%
2021年：59.0%
2024年：57.2%

从二战结束到21世纪，法国的公共支出占GDP比重从约40%一路攀升至接近60%，这个上升趋势是持续且明确的，直到近年才在高位趋于稳定。

**税收走平，违反前面总结的规律吗**？

当然没有。因为法国政府找到一个更隐蔽成本更低的收税方式，借债，花未来的钱。收税是痛苦的。借债不痛苦，阻力更小。一切都是走向阻力更小的方向。

税收比例在1980年代中期之后走平，并不是剥削停止了，而是**剥削从“显性税收”转向了“隐性债务”**。税收是当下扣款，债务是未来扣款。税收有痛感，债务有幻觉。税收遇到选民反抗，债务遇到的是债权人和利率。法国没有放弃高福利，它只是换了一个更隐蔽的账户来维持高福利。

债务的偿还方式只有几种：增长、通胀、增税、削福利、违约、金融抑制。法国长期赤字，只能借新还旧，所以真实偿还方式是**通胀侵蚀+未来增税+福利缩水**。这由全体法国居民承担，但负担并不平均。有资产的人可以对冲通胀，年轻人、工薪阶层、福利依赖者承担最多。这就是代际剥削：当代人花未来人的钱，未来人没有投票权。

**既然这样，普通法国人做什么选择是最优的**？

对普通法国人，尤其是法国男性来说，最理性的生存策略就不是反抗，不是爱国，不是奋斗，而是**把自己变成一个低成本、高弹性、国家无法有效榨取的存在**。

**无法改变系统，但你可以选择不给系统送太多燃料。** 国家抽税的前提是你有可被抽的东西。你赚得越多，税越高，抚养费越高，被绑定得越死。你赚得越少，或者你的收入越隐蔽，国家就越难从你身上拿走东西。

所以，对个人而言，最优路径不是拼命工作、积累资产、结婚生子，而是**降低自己的可被抽取价值，同时最大化自己从系统里能薅到的福利和资源。**

第一层是**经济上的低可见度**。不要追求高收入，因为高收入意味着高税收、高社保缴款、高抚养费基数。选择低薪工作、自由职业、现金交易、零工经济，或者干脆部分时间处于失业状态，让国家无法从你的工资单上扣走一大块。

如果你一定要创造财富，那就创造那些不容易被追踪的财富：人际关系、信用网络、技能、信息、影响力的交换。这些东西不显示在银行账户里，不需要报税，不容易被征收，但可以在关键时刻换取资源。

第二层是**社会关系上的高流动性**。

PACS是一对一的，但你可以不签PACS。你可以同时保持多段非正式关系，不承担法律上的财产共有和抚养义务。

你可以让伴侣为你生育，但你不去主动承认父子关系。你不需要成为父亲，只需要成为基因提供者。国家会帮你抚养孩子，伴侣会通过福利和抚养费来养，而你可以保持自由。

如果你不想被抚养费绑定，那就不要承认。法律给了你不承认的自由，你就用这个自由。如果你要和多个伴侣保持关系，那就同时进行，不要签署任何排他性的法律契约。

第三层是**福利上的最大化利用**。

法国有房补、失业金、家庭补贴、医疗补助、最低生活保障。如果你收入低，这些福利就是你的实际收入。你不需要为高福利系统感到愧疚，因为这个系统已经拿走了你本应拥有的财产权和家庭权，你只是拿回一部分。

你可以在低税收、高福利、高自由之间找到一个平衡点：足够低的收入让你少交税，足够低的收入让你有资格领补贴，足够灵活的关系让你不被家庭责任绑定。

你活得轻松，系统替你养孩子，国家替你兜底，你只需要保持健康、保持魅力、保持关系网络。

第四层是**心理上的彻底脱钩**。你不再觉得法兰西需要你保卫。国家已经把你当成了租客，你就做一个理性的租客。租客不会为房东的房子拼命，租客不会为房东的债务焦虑，租客只会计算自己在这个房子里能住多久、能省多少、什么时候搬走。

如果国家衰落了，那是系统自己的问题，不是你个人的问题。你没有义务为一个剥夺你权利的系统承担超出你义务的责任。

这个策略的结果是是一个**活得自在、不创造大量社会财富、但也不给系统制造太多麻烦的个体**。
