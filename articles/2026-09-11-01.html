婚姻不是爱情的产物，而是私有制的产物。在人类漫长的蒙昧时期，并不存在现代意义上的婚姻制度。这是恩格斯在《家庭、私有制和国家的起源》的结论，也是学术界认可的结论。

现在，法国的丈夫们不知道妻子生的孩子是不是自己的，那还要婚姻干什么？也就没必要结婚了。

当一个社会不再保障男性确认自己的后代，不再把私有财产的继承权作为法律优先保护的对象时，这个社会实质上就失去了父系社会运转的根基。

父系社会的一切制度设计，都围绕着“确定性”展开。而禁止私下亲子鉴定，等于从法律源头切断了这种确定性。

他们的义务是铁定的，他们的权利是悬空的。

答案极其简单。规避风险。不结婚。不结婚，就没有法定的父亲推定，就可以在很大程度上避免为别人的孩子承担责任。
