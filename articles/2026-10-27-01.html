        const TITLE = '法国的年轻人是对的';
        const CONTENT = `有些视频，有些文章，最关健最重要的东西，一般是几个字，不超过十个。轻飘飘地说出来，写出出来。然后围绕这个几个字，再展开聊几段，把它说清楚。这几段也不一定是放在一起的，可能前后放在不同的地方。再用大段大段不相关的叙事和逻辑，把它们埋起来，稀释，稀释到看起来似乎无关紧要，只要浓度足够低，就不具有检测意义。这样就传递了真正的信息，而且不会带来风险。缺点就是，浓度低了，疗效不够。如果有人看懂了，得自己浓缩提炼，提升药效。哈哈。

**任何国家都会遇到财政问题，根本原因不在会不会赚钱，而在于人的欲望是无穷的**。

一个人任由欲望发挥，一年消耗一个亿都不是问题，《渔夫和金鱼》里的老太婆已经把这种人性说得很清楚了。

欲望没有天然上限，得到越多就越要更多，所有人都是如此。男人会变老头，女人会变老太婆，每个人都会老，每个人的欲望都在膨胀，累加起来是无穷的，整个宇宙都填不满。

财政收入无论多高都是有限的，养老、社保、医疗，本质上都是把今天的承诺押在未来的有限资源上，用有限的财政去面对无限加总并且不断升级的欲望，当然撑不住，**甚至一个人自己的资源都撑不住他自己的无限欲望，更不用说一个国家去撑所有人的无限欲望**。

所以结果只能是必须用某种方式压制人的欲望，法律划边界，税收抽资源，福利设资格，道德劝节制，意识形态给牺牲赋予意义，通胀和债务把矛盾往后推，代际转移把压力传给后来者，

但人不会因为被压制就满意，人会不满，会尽可能在各种方式上找更多理由、钻更多缝隙、拿更多的钱。这就是制度永远有道德风险和寻租的原因。

**每个国家的财政收入永远不够用，欲望秩序不解决，钱再多也不够，制度只能压制、排序、延迟和转嫁欲望，而不能满足无穷欲望，这就是最深刻的人性分析**。

欲望的秩序问题，不是靠谁设计一套完美规则就能解决的，而是只能通过博弈来解决。

规则本身也是博弈的沉淀物，是上一轮博弈暂时停下来的边界。欲望无穷，资源有限，谁多拿谁少拿，谁先拿谁后拿，谁承担代价谁享受保障，这些问题不可能靠道德自觉自动排好，只能靠不同层次的力量相互碰撞、试探、施压、妥协，形成临时均衡。

个人之间是博弈，群体之间是博弈，阶层之间是博弈，代际之间是博弈，国家之间也是博弈。

博弈有层次，也有底线高低。

有底线的博弈靠法律、暴力垄断、道德、信任、重复交往、退出权和监督来维持。

无底线博弈则发生在约束失效、权力不对等、信息不透明、监督缺位、一次性博弈压过长期博弈的时候，这时候人会找理由、钻空子、伪装、赖账、煽动、转嫁、甚至用暴力和欺骗。无底线博弈一旦成为主导，欲望秩序就不是靠规则维持，而是靠强制、掠夺和恐惧维持，财政就不再是公共保障的装置，而变成谁有力量谁多拿的工具，承诺随时改写、拖延和转嫁。

......
