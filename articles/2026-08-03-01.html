    <script>

        const TITLE = '精英教育 | 法国精英教育：极致的情感与理性的融合';
        const CONTENT = `法国6800万人口，本土面积54万平方公里，数百年向全世界持续输出思想、规则和审美。

法国电影《心动的感觉》，女主角在毕业答辩中含着眼泪论述“爱与自爱”，讲到情深处，她精准地报出了参考文献的出处——第二场第五部分。眼泪与文献，情感与理性。

三十七年后，马克龙在四川大学的演讲。他没有稿子，面对学生提问张口就来，一边谈论莫里哀的戏剧，一边流露出对中文诗歌的个人感受。逻辑，情感。

法国的精英教育，要求在严谨的理性下，释放强烈的令人共振的情感。

在法国的预科班，学生每周都要接受口试——单独关进房间，给一个随机题目，准备5分钟，对着教授脱稿演讲45分钟，期间随时被打断、追问、质疑。这种训练持续两到三年，目的是在任何压力下，既能保持逻辑的锋利，又能保留情感的温度。

理解这套逻辑，就会发现全世界其他国家的领导人本质上都在扮演不同的“人格面具”，且与各自的地理和历史深度绑定。

...

全文三千八百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
