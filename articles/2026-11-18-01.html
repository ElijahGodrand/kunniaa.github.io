        const TITLE = '美国精英的精神内核';
        const CONTENT = `理解一个族群，要看关键时刻的言行，不能看日常。

用自然界做个比喻。

肉食动物，捕猎的频率并不高。我们看纪录片看视频，看到的捕猎场景，都是摄影师长期蹲守，剪辑出来的。

老虎，狮子，一个星期捕猎一次，每次十几分钟，猎豹，花豹，大概四五天捕猎一次，每次几十秒。其他时间，休息，巡视，睡觉，玩。

如果我们没看到它们捕猎的时刻，会觉得它们好像也没什么，似乎没什么威胁。即使它们捕猎，前半程也是静悄悄的，东看看西看看，潜伏，隐蔽，在下风口往上走，靠近之后，突然发起攻击，在极短的时间内抓住猎物，咬死吃肉。

大部分时间没危险，不代表没危险。前半程静悄悄，不代表安全。

再比如网上的杀猪盘，经常会搞一些高人设的帅哥美女，网络聊天，聊上几个星期，几个月，聊的天花乱坠，一切都好的不得了，然后再跟你线下去见面，见面了就完了，骗财偏色噶腰子。

所以一个人跟你花言巧语的时候，不一定是好人。大概率不是好人。一个很有个性，很难接近的人，说话难听，脸色难看，可能是一个对世界很失望的人。比如电影《黑社会》的号码帮的加钱哥，对谁脾气都很大，只认钱，拿钱办事，战死为止，很敬业。

相比较，吉米才是反差最大，西装笔挺，温文尔雅，说话客气，但是能一声不吭面无表情，绞肉喂狗。比加钱哥可怕多了。

有了这个认知，再来评价美国历史上的名人名言，就会看到真正有价值的东西。

不是要批评什么，而是分析他们的真正观念，评估真正的风险，以便应对。

科顿·马瑟（Cotton Mather，清教领袖）：1703年，马萨诸塞殖民地在他的影响下通过决议，对每个印第安人的头皮悬赏40英镑，到1720年赏金升至100英镑。他本人曾写道，庆幸上帝“乐意”让这场“屠杀”发生。

乔治·华盛顿（首任总统）：印第安人与狼等同，称“两者都是掠食的野兽，仅仅在形状上不同。”

托马斯·杰斐逊（第三任总统）：如果印第安人反抗，就“我们会杀死他们全部”，并主张“追踪并灭绝印第安人，要不将其赶往人迹罕至之地。”

詹姆斯·麦迪逊（第四任总统， 宪法之父）：他将前几任的逻辑制度化。1814年，他颁布法令，正式确立了头皮悬赏制度：“上缴一名12岁以上男性印第安人的头皮，奖励100美元；上缴一名妇女或儿童的头皮，奖励50美元”，“用印第安人的皮可以做出优质的长筒靴”，“美国必须灭绝印第安人，每10分钟就该处决一名印第安人”。这个时期，1美元相当于1.6克黄金，这算1400块人民币。100美元相当于14万人民币。

为什么这么贵？因为正规军更贵，边疆地区地广人稀，调动和供养正规军的后勤成本极其高昂，且正规军不擅长丛林游击战。通过重金悬赏，把民间猎人、民兵和边疆定居者转化为赏金猎人，用重赏刺激私人武装主动深入原住民腹省去长期养兵的军费。

安德鲁·杰克逊（第七任总统）：“有必要灭绝全体印第安人部落。”他主导的《印第安人移除法案》（1830年）直接导致了血泪之路，成千上万的原住民死于强制迁徙。

威廉·谢尔曼（南北战争英雄）：“我见过唯一的印第安好人，就是死人。”

......

全文五千两百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
