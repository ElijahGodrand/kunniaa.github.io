    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '深度分析 | 从英国到印尼，从钢到锂：主权国家正在用同一把刀收割世界';
        const CONTENT = `英国议会用六个半小时通过一部法案，强行抢走了敬业集团花十二年、投十二亿英镑救活的钢铁厂。

全球钢铁产能严重过剩，英国本土电价高企，美国关税层层加码——这些因素叠加，让英国仅存的两座原生钢高炉成了一个注定亏损的无底洞。敬业集团想关掉它们止损，英国政府却认为这是战争时期造船炼钢的最后火种。商业逻辑和安全逻辑撞在一起，没有妥协的余地。

于是主权决断出场了，国家可以立法抢资产、加关税、补贴产业，想做什么就做什么。但问题在于，这把刀没有安全锁。

这不是一家企业的失败，也不是一个政府的失误，而是全球主权国家在囚徒困境中相互消耗的必然结果。

更严重的，这会成为未来主权国家的频繁操作，跟国际投资的真实风险、规则与权力的边界、这个时代正在发生的深层裂变高度相关。

全文八千两百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
