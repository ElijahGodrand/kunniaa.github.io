        const TITLE = '儒家无上心法';
        const CONTENT = `儒家的无上心法，三句话。第一句，“食不厌精，脍不厌细”。第二句，“割不正不食”。第三句，“君子远庖厨”。

为什么这三句是儒家的无上心法？

人是博弈的动物。博弈的常识，明规则是摆在台面上给人看的，潜规则才是真实的意图。就好比间接战略，真正的路线往往是迂回的。如果让对手看穿真实意图，想赢就难了。有种人的策略是知行合一，相信什么就执行什么。但知行合一的人是不是真的知行合一，也很难判断。有可能打着知行合一的旗号，同时执行着明规则和潜规则。

“我思故我在”，我只能确定我在思考，确定不了解别人。地球人不是三体人，没有透明的思想。人不知道别人真正怎么想的。如果人能一眼看穿别人在想什么，那电影、话剧、相声、某底捞这些行业就不存在了，因为都是表演。

那怎么判断一个人的真实目的？人在做大事的时候，在需要聚精会神达到目的的时候，是可以演的，因为必须全力投入才能拿到想要的东西。在那些日常细微的地方，是没办法演了，因为太多了——每时每刻都有无数细小的、跟主要意图无关的事情，演着太累了。不演，真实意图就露出来了。

所以，要理解儒家，不要看儒家的大部头经典里怎么说的，要看在最日常、最不经意的地方说了什么。“食不厌精，脍不厌细”，“割不正不食”，“君子远庖厨”——这三句话，就是儒家在细微处露出的真实意图。

“食不厌精，脍不厌细”，吃的时候，要吃最好的。肉要切得精细，饭要做得精致，粗糙了不行。

“割不正不食”，这不是吃不吃的问题了，而是上升到道德、正义感、秩序感，甚至某种更神圣的东西。肉切得不符合规矩，就不吃了——这不是口味问题，这是姿态问题。他在告诉别人：我是正义，我是秩序，我是天意在人间，我定义，我裁判。你必须给我把肉切得正正的。

“君子远庖厨”，远离庖厨这种麻烦事情。为什么？第一，庖厨是纯体力活，没有什么杠杆，没有什么取巧的地方，必须实打实地干，性价比太低。一个聪明人，一个有身份的人，怎么能去干这种活？第二，为了所谓的恻隐之心——一个充满仁心的人，怎么可能亲自去杀小动物呢？所以远庖厨，大概就是这两个意思：嫌脏嫌累，还要仁慈。

这三句话翻译出来，就是：我要吃好的，而且我要当你们精神上的爹，但我不干活。

但是，如果一个人站在博弈者的角度，不带有任何道德判断，只问“这个心法成功不成功”，那么答案非常清楚：**儒家的心法是成功的，而且是非常罕见的长期成功。** 它在两千多年的时间里持续占据社会主流，影响了几十代人的思维方式和生活秩序。在人类历史上，能在一个文明中保持这么长时间主导地位的思想体系并不多见。

**这就好比两个人下棋，一个人用了某个开局，连续赢了上千盘。你可以不喜欢那个开局，但你不能否认它有效。** 儒家的心法就是这样一种“开局”——它可能不够高级，可能有很多漏洞，但它在实际操作中就是能赢，而且能赢很久。直到棋盘本身被换了，规则被改了，那个开局才失去了作用。所以，从博弈者的角度，确实要致敬儒家，要复制它的心法。

......

全文九千九百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。
