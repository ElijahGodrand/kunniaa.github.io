    <footer class="fixed bottom-0 left-0 w-full text-left pl-[30%] py-3 pr-8 text-sm text-gray-warm bg-cream/80 backdrop-blur">

    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '历史漫谈 | 权力的春药与技术的墓志铭';
        const CONTENT = `刘邦打天下时跟韩信“解衣推食”，赵匡胤黄袍加身后请石守信喝酒，朱元璋坐稳江山把老兄弟杀了个遍——历史反复证明：**共患难靠眼泪，同富贵靠合同。**

创业期没钱，老板给你权、给你股、喊你“兄弟”，是因为需要你拼命。业务跑起来了，账上有钱了，老板开始睡不着了——怕你功高震主，怕你带人单干，怕你手里的代码只有你能改。

于是，收权开始。

从“你全权拍板”到“你负责战略方向”，从“技术合伙人”到“技术顾问”，从“git主分支权限”到“只读权限”——走的全是一个剧本：刘邦夺兵符、赵匡胤释兵权、邵氏兄弟一场寿宴端掉二哥。

今天你笑着看历史，明天历史就会在你身上重演。

**怎么办？多条硬核策略。**

全文八千六百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
