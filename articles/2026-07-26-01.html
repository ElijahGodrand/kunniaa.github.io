    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '技术探索 | 如何用最小的成本，把PostgreSQL跑起来、玩明白、不丢数据？';
        const CONTENT = `PostgreSQL 不是一个数据库，它是一个黑洞——正在吞噬整个数据库世界。StackOverflow 2025 年数据显示，PG 使用率飙升至 55.6%，断层式领先 MySQL，连续三年三冠王。这是正在发生的事实。未来做软件研发，PostgreSQL 大概率是绕不开的必选项。

我写了一个从零开始跑通 PostgreSQL 的完整流程，包括踩过的坑、以及 PostgreSQL 与其他数据库截然不同的机制。

从 Docker 部署、数据卷持久化、Python 增删改查，到 MVCC、VACUUM、大小写陷阱、时区雷区——一篇全讲，照做就能跑通。

全文三千五百字，星球见。

我是昆尼Kunniaa。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
