    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '深度分析 | 旧模式的音乐和电影正在从生活里撤退';
        const CONTENT = `2025年，中国电影的总票房虽然涨了，但这个增幅主要靠《哪吒之魔童闹海》，其他部分跟2024年持平；美国票房比疫情前少了四成观众，靠票价涨价勉强维持体面。

听歌的人也在减少。某某音乐月活连续17个季度下滑，从近7亿跌到5.28亿。美国的流媒体增长停滞，上半年总收入只涨了不到1%。

更关键的是：新歌没人听了。美国市场75.8%的播放量来自老歌，Spotify年度前十有七首是老歌。电影也一样，2025年北美票房前十，只有一部原创，剩下全是IP续集和改编。

这是成本在重新洗牌。

成年人时间越来越贵，试错成本太高，没精力去筛选新东西。所以他们宁可听年轻时就熟悉的老歌，看年轻时就看过的老电影。

资本敏锐地捕捉到了这个变化——Netflix花827亿收购华纳IP，贝恩资本投12亿买老歌版权，老东西正在变成最稳定的收息资产。

与此同时，短视频以极低的注意力成本，提供了一种“赌博式”的即时快感。15秒一个刺激，无限下滑，永远不知道下一个视频是什么，停不下来。

三个趋势同时发生：时间变贵，内容变老，娱乐变短。

这意味着，未来进入音乐或电影行业，几乎是在逆流而上，很难有收益。

但如果想收购老IP、投资经典版权、可能是赚钱的。

更进一步，要理解理解电影和音乐是如何被“科技进步导致的成本坍塌”重构的，这对投资至关重要......

关键数据均标出了引用出处，避免幻觉。

全文六千两百字，星球见。

我是昆尼Kunniaa。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
