    <script>

        const TITLE = '庄子内篇次序与实修';
        const CONTENT = `通行版《庄子》内篇是乱序。

内篇的次序是郭象排的，他是西晋人，整理注解庄子，今天读的33篇《庄子》，就是他把汉代52篇、魏晋27篇的各种版本删订整理之后定下来的。他把《逍遥游》放在第一，把《齐物论》放在第二，后面是《养生主》《人间世》《德充符》《大宗师》《应帝王》。

这个次序，一千多年来没人动过。

**郭象把《逍遥游》放在第一，是非常玄妙的操作。**

大概是为了上来就开大招，折服读者的灵魂。这个想法，还有个很有价值的副作用，《逍遥游》光芒遮掩后面的厉害的现实的大招，降低了攻击性。

如果把大招放在前面，必然为很多上位者不喜，原来庄子是教牛马怎么对付我们呀？后面的次序也是牛马们自己成仙了，不给我们干活了，禁掉禁掉。

事实上他成功了。《逍遥游》是庄子内篇里最出名的，没有之一。鲁迅在《汉文学史纲要》里说庄子“**其文则汪洋辟阖，仪态万方，晚周诸子之作，莫能先也**”。司马迁在《史记》里早就点出庄子“**洸洋自恣以适己**”的想象特点。刘凤苞在《南华雪心编》里说得更绝：“**缥缈空灵，则推南华为独步也。**” 这些评价，大多受《逍遥游》的影响。

一翻开书，鲲鹏展翅九万里，怒而飞，其翼若垂天之云，还没搞清楚庄子要说什么，已经被震住了。觉得庄子太高了，太深了，太玄了，仰着头看，越看越觉得自己渺小。

后世讨论《逍遥游》的最多，其次是《齐物论》，越到后面，讨论越少，大招都在后面。

负面结果就是，练成《庄子》的也少了。因为《逍遥游》讲的是“至人无己，神人无功，圣人无名”。这是庄子最高境界，是终点，是果，是走完前面六步之后自然到达的地方。把它放在第一步，等于让一个刚学会走路的人去跑马拉松。不知道什么叫“无己”，因为从来没有在人间世里经历过“有己”；不知道什么叫“无功”，因为从来没有在应帝王里做过事；不知道什么叫“无名”，因为从来没有在大宗师里体过道。直接读《逍遥游》，读不到全流程的东西。**这就是为什么许多人读庄子读不懂。**

《逍遥游》是果，不是因。它是走出来的，不是学出来的。就像吃饭一样，《逍遥游》是第七个小笼包，不是第一个。不可能一上来就吃第七个，得从第一个开始吃。

当然，其他六篇次序也是乱掉的。比如，有扎实的文本证据，证明《应帝王》必须紧随《齐物论》。《大宗师》是出世法，必然高于《应帝王》世间法。

......

全文六千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
