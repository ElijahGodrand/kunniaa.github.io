        const TITLE = '奇怪角色：日本天皇';
        const CONTENT = `研究日本的历史，会发现一个很有意思的矛盾：各种文章各种书籍都用某某天皇某某天皇划分日本的历史，看起来天皇很重要，但是看日本的古装剧和小说，天皇那过得不是一般惨，穷得一塌糊涂，破烂不堪，手下的大臣也都穷的当衣服要饭，乞丐一样。

为什么这么诡异？

后来发现，日本的天皇跟普世观念的皇帝概念差别很大，在绝大部分历史时间里，是个祭司，每年举行一些祭祀仪式，但是，不掌管军队，不征税，没有人事任命权，啥都没有。有些时期太穷了，要靠卖字维生。

为什么没有？因为不能碰这些东西，碰了就不是天皇了，或者倒血霉。

看起来非常奇怪，但确实是以非常拧巴的方式形成。

得从源头说起。

先说日本真正掌握权力、武力、税收、人事的是哪些人。

3世纪到6世纪的**古坟时代**，日本列岛只有大大小小的部族联盟。

这个时期掌握武力和征税权的是各地的豪族，比如葛城氏、苏我氏、物部氏，他们各自拥有私兵和被称为屯仓、田庄的直属领地，自己向领民收租，自己带兵打仗。人事任命权在各部族内部世袭，谁拳头硬谁说了算。

后来被称为天皇的那个角色，在这个时代根本不叫天皇，而是被称为大王，比如倭王武。

大王的本质是大和地区部族联盟的**盟主兼首席巫师**，主要工作是主持祭祀太阳神和各部族祖先神的仪式，在豪族发生利益冲突时充当宗教仲裁人，**本身并不具备调动全国军队的绝对权威**。

7世纪到8世纪的**飞鸟与奈良时代**，大王家族联合部分豪族发动乙巳之变，消灭了专权的苏我氏，开始照搬唐朝的律令制，试图建立中央集权。

**武力名义上收归朝廷组建的军团，实际上很快由地方郡司和新兴武士雏形掌控**。

征税权通过班田收授法收归律令制政府，由太政官体系下的民部省负责征收租庸调。

人事任命权也掌握在太政官和皇族核心手里。

在7世纪末，为了在外交上和唐朝皇帝平起平坐，**大王这个充满部族首领气息的称号被正式废除，改称为天皇**。但即便改了名字，这个新诞生的天皇在现实运作中依然被迅速架空，宫廷里爆发了无数次皇族与外戚藤原氏的流血政变，天皇的主要精力很快被重新引导向抄写佛经、修建东大寺大佛以及主持神道教大尝祭等宗教事务上。

9世纪到12世纪的**平安时代**，律令制彻底崩塌，庄园经济取代了国有土地。

**武力掌握在地方豪强和开始崛起的武士集团**手里，比如伊势平氏和河内源氏，朝廷自己连京城的治安都维持不了，只能雇佣武士当看门狗。

征税权被庞大的贵族庄园主和各大寺院瓜分，朝廷几乎收不到多少直接税。

人事任命权和最高行政决策权全部被外戚藤原氏垄断，藤原氏家族成员轮流担任摄政和关白，史称摄关政治。

......

全文一万字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
