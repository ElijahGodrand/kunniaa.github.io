    <script>

        const TITLE = '算力和博弈碾压：刘邦平定陈豨并顺手杀了韩信';
        const CONTENT = `一个原子化的人，一粒散沙，如果想在现代社会获得成功，应该怎么做？这个是宏大问题，宏观历史的大人物提供了一些精彩的答案，从中可以能提炼出一套大多数人也能用的博弈经验。

从刘邦平定陈豨叛乱，可以得到十条经验，比如：第一，动作必须要快；第二，必须多路进攻，把所有的策略同时压上去，让对手的算力过载；第三，任何有威胁的人都要清除，不要有妇人之仁，刘邦在邯郸确认陈豨不成气候之后，很快在长安杀了韩信，前后只隔了两三个月...

公元前197年，代相陈豨造反。刘邦亲征。这是汉初政治格局中一次不算最大但意味深长的震荡。陈豨的造反本身并不算高明，刘邦的平叛过程也称不上惊心动魄，但这场战争把刘邦的博弈策略摆到台面上了，同时也暴露了刘邦心里更深的盘算。平定陈豨这件事，从军事上看只是一场局部叛乱，从政治上是一次精心设计的系统清理，最大的那个目标不是陈豨是韩信。

陈豨这个人，出身不算低。他是战国末年魏国宛朐县人，秦末乱世中算得上一个地方实力派。公元前208年，刘邦打到宛朐时，陈豨以特将的身份带着五百名士兵加入刘邦阵营。五百人，在刘邦早期的队伍里不算少，所以他起点不低。之后他历任郎中、游击将军，一路升迁，但因为没有什么特别耀眼的战功，也始终没有进入刘邦的核心决策层。他真正被推到高位是在公元前201年。那一年刘邦封他为阳夏侯，又过了两年，也就是公元前200年白登之围以后，刘邦任命陈豨为赵相国，全权统领赵、代两地的边防军。这是一份极其重要的权力。赵、代地处汉朝北部边境，直接面对匈奴的威胁，刘邦需要一个人坐镇北方，手里握着当时汉朝最精锐的边防部队。陈豨被选中了，不是因为他最能打，而是因为他资历够老、看起来够稳、够听话。

但陈豨的问题恰恰出在这里。他手握重兵却没有足够的政治头脑，他身处高位却没有驾驭这种位置的格局。他到任之后开始大肆招揽门客，门客里有很多是商人出身。当时的边地政策对商人很不友好，汉朝严禁铁器等战略物资出境交易，直接断了代地商人的财路。陈豨的门客里有一大批这样的人，这些人有怨气、有能量，也有自己的算盘。陈豨对他们不加筛选，照单全收，在赵、代两地形成了相当大的势力网。这个势力网很快引起了朝廷的注意。赵相周昌向刘邦告发陈豨门客横行不法，刘邦派人调查。调查还没出结果，公元前197年七月，刘邦的父亲刘太公去世，刘邦召陈豨回京奔丧。陈豨称病不往。这个动作一出，刘邦心里就已经有数了。九月，陈豨正式起兵，自称代王，联络韩王信和匈奴，拉开了叛乱的序幕。

刘邦的反应极快。陈豨九月起兵，刘邦同一个月就已经从长安出发。他到达邯郸的时间是公元前197年的冬天，距离陈豨起兵不过一两个月。刘邦到邯郸的第一件事就是看地形、看陈豨的部署。他一看就发现陈豨没有占据邯郸，也没有扼守漳水。邯郸是赵国的心脏，南下北上的咽喉要道，谁占了邯郸谁就掌握了整个河北平原的战略主动权。漳水是邯郸的天然屏障，扼守漳水就能迟滞南方的进攻兵力。陈豨把这两个最关键的要点全都放掉了，**刘邦当场断定陈豨无能为矣**。

......

全文一万一千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
