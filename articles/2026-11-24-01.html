        const TITLE = '精神战力：无敌的阿Q';
        const CONTENT = `每个朝代，每一年，每一秒，都有无数的人在不快乐的状态。这种不快乐，不管人类怎么发展，不管科技怎么进步，都是不快乐的。

现代社会的大多数人，比古代皇帝的享受还要好，但仍然不快乐。

弗洛伊德写过一本书《文明及其不满》，是他晚年对文明本身的分析。他说，**文明不是让人幸福的，文明是让人变得可以共处的。文明的历史，就是压抑本能的历史**。

文明必须本能压下去。规矩、道德、法律、良心，都是用来压制的。文明的进步，建立在欲望被压制的基础上。按得越紧，文明越高，但人内心的不适也越深。

这个压制不仅仅靠外面的人拿鞭子完成的，文明通过教育和习惯，在每个人心里装了一个叫超我的监视器。人想干坏事，甚至只是想了一下，超我就用罪疚感来惩罚他。文明越发展，罪疚感越重，人越不快乐。

他还列了人类痛苦的三个根源，这三个根源里都是没钱或者没房：第一，自己这副会衰老、会生病的身体；第二，外面那个残酷的、不讲情面的大自然；第三，人与人相处本身带来的痛苦，也就是痛苦来自社会各角度。

第三条最要命，痛苦不是来自敌人，是来自必须跟别人生活在一起这件事本身。文明想解决第三条，结果它自己成了第三条的一部分。

一个人随着年龄的增大，他的不快乐会越来越多，儿童的时候很快乐，青少年也不错，中年之后就彻底变了，越往后越糟糕。

那怎么快乐起来呢？那这个问题怎么解决呢？

我们看看鲁迅的小说是怎么写的。鲁迅很多文学作品都有相互对照的范例，对照出两个人，一个是闰土，一个是阿Q。

闰土跟阿Q的区别就是，闰土大概是没什么希望了，不可能快乐了，但是阿Q是可以的，他有精神胜利法，自己很爽，有时候还能喊喊革命了，吓唬赵老太爷。

如果是穿越文，让我们穿越，系统让我们润土和阿Q之间选择一个，大部分人应该会选择阿Q，几乎没人选闰土。

鲁迅不认可阿Q的精神胜利法。我的想法是，因为阿Q的精神胜利法对外产生的影响太小，顶多让他自己快乐一点，能去城里打工，赚点钱，不能根本改变，鲁迅哀其不幸怒其不争。

《阿Q正传》写于1921年，一百年出头，精神胜利法也被嘲笑了一百年。但今天，很多人使用的东西就是精神胜利法。

精神胜利法就是，我永远是对的，我永远没有错。我能找到各种解释，解释为什么如此。这种解释有两种：一种是内在的，阿Q的，一种是外在的，指责别人错了，没做好，比如川普，乔布斯，马斯克，都喜欢开人。川普的名言，u r fired。乔布斯，马斯克，在公司跟员工一起坐电梯，会问问题，对方回答让他不满意，立刻开除，以至于员工们一看到他们来坐电梯，自动远离，不跟他们一起坐。

这种精神胜利法，乔布斯叫作现实扭曲力场，马斯克叫作第一性原理加上绝不投降，彼得蒂尔叫作逆向思维，稻盛和夫叫改变心相，名字一个比一个高级，里面的东西跟未庄土谷祠里那个瘦骨伶仃、黄辫子、破毡帽的阿Q发明的东西是一样的。

......
