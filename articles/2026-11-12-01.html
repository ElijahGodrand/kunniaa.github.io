        const TITLE = '年猪理论修改版';
        const CONTENT = `年猪理论：把所有人分成两类，一类是即将过年的猪，过年要杀猪；一类是屠夫，杀猪的。屠夫少，年猪多，大多数人是年猪。

一年365天，对猪来说，364天都很舒服，天天有人给吃的，有病可以治病，每天笑嘻嘻的，一切很和谐很美好，只有最后一天不美好，这一天在概率上看起来很小，三百六十五分之一，千分之二点七，小的不能再小了。但是很致命，所有的猪都有这一天。所有的猪，一个都不少，全部。

**年猪的命运是定期重演的。这种重演是有规律的。规律是可以预测的**。

历史上第一次大规模杀年猪是汉武帝。这个人，我非常讨厌，非常不喜欢，是个烂人，屠夫，罪该万死。

他搞出个算缗令和告缗令。

所有人都要按年叫个税，做生意的，每年6%，个体户，每年3%。

“凡属工商业主、高利贷者、囤积商等，不论有无市籍（汉代商人另立户口册，叫做市籍），都要据实向政府呈报自己的财产数字，并规定凡二缗（2000文，一缗为一千钱）抽取一算，即一百二十文（一说二百文）。而一般小手工业者，则每四缗（4000文）抽取一算。这叫做“算缗”。除官吏、三老（乡官，掌教化）和北边骑士外，凡有轺车（即小马车）的，一乘抽取一算；贩运商的轺车，一乘抽取二算；船五丈以上的抽取一算。”

隐瞒不报，或呈报不实的人，罚戌边一年，并没收他们的财产。有敢于告发的人，政府赏给他没收财产的一半，这叫做告缗。

禁止有市籍的商人及其家属占有土地和奴婢，敢于违抗法令的，即没收其全部财产。

个税只能按照个人收入计算，不能按照财产计算。按照财产收收个税，每年6%，这个数字是极度恐怖的。就像一个房子价值200万，每年收12万个税，受得了吗？每月1万个税，住200万的房子的人，一个月收入有没有一万块都难说，大概率没有，全得交上去。

而且不仅仅是房子，所有财产都的算入个税口径，衣服，首饰，家具，车子......

更狠的是处罚，处罚才是真实目的，就是为了没收全部财产定的。

这个搞法，就好像，软件开发不能出bug，出一个bug，没收全部个人财产。

告缗令的核心设计是一套激发人性恶意的精算模型。赏格极高，告发属实，被告者的全部财产没收，其中一半直接赏给告发者。最致命的一条是无论诬告还是错告均不追责，这意味着告发零成本。结果就是告缗遍天下。在零风险和对半分成的暴利驱动下，邻里熟人乃至亲族之间的检举揭发彻底失控，社会信任从根基上被瓦解，把一个社会结构连根拔起，把无数家庭搞破产了。

后果很可怕，司马迁用一句话概括了覆盖面，中家以上大抵皆遇告。全国中等资产以上的家庭几乎无一幸免。抄没的体量极其骇人，财物以亿计，奴婢以千万数，田大县数百顷小县百余顷，宅亦如之。一个社会赖以运转的中坚力量在几年内被系统性清零。

告缗令下，天下嚣然丧其乐生之心，整个社会陷入活着没意思的集体绝望。司马迁还记录了一个极其精准的后续反应，民偷甘食好衣，不事畜藏之产业，百姓不再储蓄不再投资产业，有钱就赶紧吃掉穿掉，因为不知道下一次告缗什么时候落到自己头上。

后世史家，痛斥此举是以天子而同于盗与兵，天子用国家暴力做起了强盗的勾当，它摧毁的不仅是商贾，更是政府的信用与道义的合法性。

告缗令在后世一遍遍重演。

......
