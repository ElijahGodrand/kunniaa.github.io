    <script>

        const TITLE = '精英教育 | 不要有幻想：精英教育就是战争思维';
        const CONTENT = `梳理英法德精英教育的数百年历史，可以得到钢铁般的结论：这三个国家精英教育都是用战争思维锻造出来的。

**法国**，从百年战争的“自由军团”之乱到查理七世敕令骑兵队，再到路易十四、拿破仑的集大成。裴蜀“四卷天书”的严苛数学考试筛选出拿破仑这样的学霸，综合理工学院至今穿着军装走在国庆阅兵第一方阵——“大学校”体系就是一台为国家输送战争精英的永动机。

**英国**，克伦威尔在内战溃败中自掏腰包创建“新模范军”，把纪律刻进军队。1741年伍利奇皇家军事学院将科学引入军队，军官考试制度继而催生了全球第一个现代文官制度，最终倒逼牛津、剑桥全面改革。

**德国**，三十年战争把勃兰登堡碾成废墟，“士兵王”腓特烈·威廉一世用1714年《规章》把士兵分解成67个口令、167个动作，每天凌晨2点训练到中午。沙恩霍斯特1808年废除贵族世袭，用双科考试选拔军官，1810年创建全球第一所参谋学院。从小学棍棒教育到大学决斗文化，整个德国教育体系就是一座巨大的兵营。

这三个国家的精英教育都指向同一个答案：**用战争的方式筛选人、训练人、组织人，尽可能用战争思维解决问题。**

全文一万七千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
