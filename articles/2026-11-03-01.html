        const TITLE = '研究《红楼梦》，看什么';
        const CONTENT = `看《红楼梦》，要看它最重要的东西，权力和金钱。它跟《金瓶梅》本质上是一样的。《金瓶梅》直白，赤裸裸。《红楼梦》是高级版的《金瓶梅》，更有艺术性，风花雪月，诗词歌赋，琴棋书画，把权力和金钱藏得深。藏就是艺术。千呼万唤始出来，犹抱琵琶半遮面。这才有吸引力。画家库尔贝作品《世界的起源》，不藏，艺术感并不高，视角还有点恶心，肯定不如安格尔的《泉》，也不如谢楚余的《陶》。

爱情不是《红楼梦》的主题，它是诱饵，把读者拉进场。我们以为是爱情悲剧，读着读着发现爱情做不了主，做主的在别处。这个别处就是权力和金钱，藏而不露，靠日常一丝丝透出来。

**爱情是权钱结构的探针**。怎么表现权钱？用爱情。这个做法最强烈，最容易让读者共振。但探针不是目的，权钱才是目的。

**为了让探针更敏感，给爱情增加很多极限条件，让人同情**。

比如林黛玉，无父无母、无家产、无兄弟，在婚姻市场上是一个没有议价能力的孤女，又才气最高，最聪明，还身体有病，不是长寿之象。

这些极限条件加上去，让人非常惋惜林黛玉。

给贾宝玉加的极限条件，行为偏僻性乖张。因为他的任务是继承家族资源，家族联姻，要巩固权力。这是无情的生意，他不想服从。

宝黛爱情是权钱结构里不按价格走的东西。

他们的地位，生活，享受，来自权钱结构。但他们不想维持和强化这种权钱结构。那其结果就必然完蛋。要么他们完蛋。要么权钱结构完蛋。权钱结构完蛋，他们俩也得完蛋。所以宝黛爱情必然被碾碎。

其他都是细节了。宝钗的金锁、湘云的麒麟、黛玉的孤女身份、贾母对“不是冤家不聚头”的态度、王夫人对晴雯的清洗，每一处“情”的波动，底下都是联姻报价、财产安全、内宅控制。

权钱在细微处，怎么操作，怎么改变走向，怎么博弈。

从细微处下手，最重要的原因是成本低。蛮力，动作太大，成本高。不得已的时候可以用蛮力，但最好少用。如果不得已用蛮力，最好是彻底消除一切隐患，力挺扫雪，斩草除根，车轮放平。

《红楼梦》是一个谜语，我们要从细微之处拼凑出全局，这也是它比《金瓶梅》更高级的地方。

洪承畴掸掸衣服上的灰，范文程就知道，这人绝食是假的，肯定会投降，得给他找个台阶，送点美女什么的。

《金瓶梅》是把钱权交易摊在桌面上，西门庆怎么买官、怎么放债、应伯爵怎么明码标价地帮闲，赤裸、直接、高效。《红楼梦》把同一套钱权逻辑埋进了礼法、情感、日常，看到的永远是“表面”，“真相”要自己拼。

表层是情感，谁跟谁好、谁跟谁恼了、谁给谁送了什么、谁在背后说了谁一句。

中层是权力关系，谁说了算、谁被边缘化、谁在争位置、谁在替谁撑腰。若隐若现，但细看处处是痕迹：贾母赏菜的顺序、王熙凤对谁哭穷对谁大方、探春理家时谁配合谁拆台。

底层是金钱关系，月钱、地租、当票、赏赐、体己。这层最隐蔽，但它支撑着上面两层。没有银子，权力转不动；没有权力，银子守不住。

这三层之间不直说。情感底下有权力，权力底下有钱，挑明了，礼法就破了，体面就没了。贾元春也只能说皇宫是“见不得人的地方”。

......

全文八千八百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
