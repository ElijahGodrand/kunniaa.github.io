    <script>

        const TITLE = '《原则》即拒绝';
        const CONTENT = `达利欧写过一本书叫《原则》，全书有21条高原则、139条中原则和365条分原则。这些原则涵盖了赚钱，生活，管理，内容繁复，读完很容易陷入一种感觉：看的时候，道理都对，但记不住，做不到。

我也读过。现在问我这本书有什么原则，我想不起具体的条款。21+139+365=525，太多，多了就不稀缺了。不稀缺的东西，大脑不在意。任何一个领域，人类大脑最多记住三个品牌。如果这本书只讲三个原则，应该能记住一两条。所以要简化。

再说，《原则》是基于美国的文化、职场和经验写的，桥水员工薪资太高，福利太好，实习生月薪2万刀，正式员工无限期带薪病假，太完美，对底线太高，不够残酷，拿到本土肯定水土不服。中文版是2022年出版的，现在四五年过去了，影响力没有想象的那么大，甚至还在衰退之中，这说明想在本土有效，还得往残酷的方向强化。

按照这两个考量，我把全书浓缩成两个词：拒绝；极致。拒绝是一种带有负面情感的词，会触发情绪，有情绪才记得住。比例上，99.9%的拒绝+0.1%的极致。原则就是拒绝，记住拒绝就行了。标配是拒绝，选配是极致。只要做到拒绝，人生满分一百，你能打99.9，岁月静好，一生平安，幸福快乐，没有大风险。极少数人能做到极致，100分，累一点，也不会太累，因为已经拒绝很多东西了，只做一点点就行。

就这两个词，拒绝，极致。

很多痛苦来源不拒绝。

比如内卷，内卷来源于不拒绝。拒绝996，007。

文明这个东西，本质上是一种汲取体系。文明具有一个独立的抽象的人格，像一个人。一个抽象的人要活下去，就必须吃掉一些东西，这就是汲取。然后生成一些东西，以便持续活着。

“人类将复杂共同体生产、积累、汲取和燃烧德性的运作机制称为文明，将秩序的输出、输入、交融和冲突称为历史。”

白酒，社交用的，社交是文明一种维持群体网状结构的一种方式，但白酒是一级致癌物，没任何好处。一线城市可以相对自由一点，喝不喝都行，其他地方都有很严重的喝白酒的现象，社交pua，这个就是汲取个体的健康维持文明内部网络结构。

彩礼，汲取财富。中式婚礼，汲取财富，汲取健康。房地产，汲取财富。

汲取无处不在，想从文明中获取收益，尽量不被汲取，必须拒绝。

一线城市，一个人从早晨九点忙到晚上十点十一点，工作日差不多都这样，如果赚的钱不多，那就是被文明汲取了。不管做什么，时间付出去了，十几个小时，做了什么不重要，做什么都是文明所需，付出的时间没有区别，收入差别很大。

只有什么情况是划算的？365x24小时，什么活都不干，或者想干什么干什么，时间全归自己，此时，你是保本的，如果能始终保持这个状态，还能赚到一点钱，才是反向汲取文明，这是个体追求的最高境界。

文明也产出一些有价值的东西，比如科研，知识，医疗，食物。要反向汲取这些有价值的东西。达里奥是反向汲取的高手，从文明赚到很多钱，《原则》就是防范文明汲取并反向汲取文明的拒绝体系。

......

全文六千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;

            const p = document.createElement('p');
