第一部，1997年，基努·里维斯和阿尔·帕西诺《魔鬼代言人》。

美国是个把"法"供成神的国家。法律好比圣经，法院是神殿，律师是神职人员。关健的门，都由律师把守。

出生要经过他们的文件；婚姻要经过他们的签字；创业、上市、离婚、遗产、破产、刑事、进监狱、出监狱，每一道门都有律师。法律能随时碰到你，只有律师懂法律语言，所以它们是大众和这个国家的翻译。

翻译，不是开玩笑的。

法律英语是"另一套东西"，就像文言文和北京话都叫中文。差别大多了。

很多词是普通词被法律借用表面认得，意思完全不同，consideration，普通人，考虑，法律，对价，合同里你拿什么换什么，premises，普通人，前提，法律，房屋，经营场所。每个词都认识，连起来一句都不懂。

外来词堆砌，法语，拉丁语，都有，不查字典，肯定不懂。

句子结构复杂，一段法律文字可以把状语、从句、插入语像香肠一样堆到三十行外，主语和动词隔了半页纸。不是写的人口语不好，是故意不写成口语。每加一层"除非……且在不违背……的前提下"，都是对某种解释再加一道保险。结果就是语句越长，越难反驳，也越难读。

言外之意才是正文。法律语言是一种咒语：它不在于"把话说清楚"，而在于"说出这句话就产生了法律效果"。hereby，特此，deemed，这些词不是让读者明白，是让合同双方必须照做。所以准确说，它是一种具有执行力的话语，像合同上的签字盖章，和聊天的语言是两种用途。

只有律师能搞定。

所以美国律师很多。
