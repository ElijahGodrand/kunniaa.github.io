        const TITLE = '破坏式创新，破坏式财富';
        const CONTENT = `现在经济下行，大家赚不到钱，找不到工作，有点很痛苦。

**赚钱这个事，以经济学家熊彼得为界，分两个时代。熊彼得之前，是生产即财富的时代。熊彼得之后，是破坏即财富的时代**。

**破坏能力，就是赚钱能力**。

熊彼特出生在1883年，到现在已经143年，他从小经历资本主义疯狂发展的岁月。1942年，他在《资本主义、社会主义与民主》里提出创造性破坏。

他的原话是，创造性毁灭是资本主义的基本事实，稳态的资本主义本身就是自相矛盾的提法。资本主义不可能稳定，它必须不断革命化，不断从内部推翻旧结构。新的组合上来，旧的组合就得死。新企业崛起，旧企业衰退。新财富增加，旧财富蒸发。这个过程不温柔，不体面，不讲道德。

他说的创造性破坏，英文是Creative Destruction，Destruction来自拉丁语destruere，由de和struere组成。de是向下、彻底反转，struere是建造、堆砌。字面意思就是把建造起来的东西拆下去。不是修，不是改，是拆。这个词根里自带一种对抗性。你建，我拆。你搭，我推。

剑桥词典的定义是to damage something so badly that it does not exist or cannot be used，损坏到不存在，或者无法使用的程度。不是影响，不是削弱，是终结，no longer exists，不再存在。

Destruction是一个act，是一个行为，是有主体在执行的。不是自然衰败，不是意外事故，是有

词根是拆掉建的东西，定义是损坏到不存在，同义词是拆除和屠杀。熊彼得把这个词和Creative放在一起，形成了一种冷峻的张力。创造的力量，以毁灭的方式运作。新的东西要生，旧的东西就得死。不是自然死，是被杀死。不是慢慢退场，是被抬出去。不是让位，是被清场。

19世纪末20世纪初的资本主义，非常狂野，非常残暴。洛克菲勒的标准石油，巅峰时期控制美国炼油90%以上。卡内基的钢铁，摩根的金融帝国，铁路巨头之间的价格战、回扣、歧视性定价，都是往死里打。

标准石油把无数炼油厂逼死或收购，美国钢铁把几百家小钢厂整合掉，福特用流水线把手工汽车厂送进坟墓。

**失败者不是被枪毙，是被市场清除。现金流断裂，客户跑光，供应商断供，银行抽贷，最后关门**。这跟战争中的围城、断粮、歼灭是一样的。打到最后，不是合并，就是破产。

美国南北战争的时候，有一本小说叫《飘》，大致从**1861年**南北战争爆发前夕开始，一直写到**1870年代**重建时期，跟熊彼得在同一个时代。小说出版于**1936年**，比熊彼特提出破坏式创新早了4年。

小说里的男主角女主角都很凶悍，尤其是那个郝思嘉的爸爸，农场主，更是一个极其强悍。有一个情节，有伤兵过来抢劫，家里没有男人，两个女的把那个进来抢劫的伤兵干掉了，把财物保留下来。那个时代，不凶悍就活不下来。农场被抢，家人被杀，土地被烧，只有最凶悍的人才能保命，赚钱。

所以，咱们抬头看一下，城市，建筑，社区，CBD，工厂，客流，无数的商业模式，难道它们都是无敌的？无懈可击的？永远不倒？永远不死？

搞破坏没有不确定，也没有恐惧。就像，茶杯一摔就碎，这是确定性的百分百，没啥不确定，这有什么恐惧？搞破坏，要么算准了硬干，大棒平A。要么就是找到弱点，狂捅。

除非宇宙空无一物，彻底热寂，那没啥破坏了，那赚不到钱。只要但凡有东西，就有弱点，就可以破坏，就有机会。

男的比女的破坏力更大一些，男富豪的就多一些，女富豪偏少。

......


全文八千五百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
