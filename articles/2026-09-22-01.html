    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '胡适与禅宗';
        const CONTENT = `禅宗有一些很难理解的语录。

德山宣鉴禅师常以棒打为接引手段，其著名家风是“**道得也三十棒，道不得也三十棒**”。无论你答得上来还是答不上来，都要挨打。

僧问大梅法常：“如何是佛法大意？”师云：“**蒲花、柳絮、竹鍼、麻線。**”

僧问赵州：“万法归一，一归何处？”师云：“**老僧在青州，作得一领布衫，重七斤。**”

僧问慈明楚圆：“如何是佛？”师曰：“**人老病生。**” 又问：“如何是禅？”师曰：“**鼻孔入地。**”

僧问五泄灵默禅师：“如何得无心去？”师曰：“**倾山覆海宴然静，地动安眠岂睬伊。**”

有人问：“既是三界大师，为甚么被弟子锁？”侍者无对。法眼禅师代答：“**弟子锁，大师锁。**”

僧问云门，“如何是佛门？”曰，“**乾矢橛**”。

僧问赵州，“如何是祖师西来意？”州曰，“**庭前柏树子**。”

后世禅师将这类对话视为“金刚圈”，“栗棘篷”，认为是截断学人思维、令其无法依循常规逻辑作答的利器。这些答非所问、逻辑断裂的对话，是后世禅宗文学高度成熟的产物。

**从初祖达摩到五祖弘忍，早期禅法清晰而朴素，非常好理解，直到神会为了争夺正统，将“顿悟”打造成一个低成本、高回报的品牌，才彻底扭转了禅宗的方向**。

**从神会开始，博弈进入新阶段，无所谓落后还是先进，是更激烈。既然神会发明了新方式，那后面的博弈就在新方式下进行，不可撤回**。

......

神会之前，从达摩到弘忍，修到最后修出来的是一个**明白人**。这个人情绪稳定，不被外境牵着走，遇到好事不得意，遇到坏事不崩溃，对生死有某种程度的超脱，看人看事比一般人透。这个东西是长期渐修的自然结果，是**人格的缓慢转变**，可观察、可验证、可重复。跟他相处几年，能看出他跟一般人不一样。他死的时候不怕，遇到麻烦不慌，处理事情有分寸。这就是修出来的东西——**稳定的智慧**。

神会之后，修到最后修出来的是一个有过特殊体验的博弈高手。他在话头与机锋之间辗转多年，与各路高手反复交锋，被夹断过脚，被打落过水，被棒喝过无数次。某个瞬间，大脑终于宕机了，那个坚固的自我感如薄冰般碎裂消融，一种与万物合一的感觉得汹涌而来。师父点点头，说，你悟了。他就信了。再回到日常，他依旧是那个在机锋中杀出来的人，只是反应更快，出手更准，在各种激烈交锋中游刃有余。

......

全文七千八百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
