### 一、 资产属性与投资心态（共1条）

1. 从2026年起，房子是消费品了。也就是说，不管你花多少钱买房子，买新房还是二手房，每年至少贬值1%，能承受得起，就买。承受不起就租。

5. 空气质量，PM2.5年均浓度最好压在25以下，至少不能超过35，优良天数比例最好在90%以上。南方空气好的城市往往湿度高，北方改善快的城市冬季还有污染过程，得有所取舍。
6. 选城市和区域时，不看常住人口（很多是虚报或流动人口），只看该区/该市近5年“在校小学生人数”的增减率。小学生人数持续流出的城市或行政区，意味着年轻家庭正在逃离，公共财政和教育资源必定走向收缩与衰败。

7. 许多二手房（特别是1990—2000年代的房产）土地使用权只有40年、50年或划拨性质。虽然政策说“自动续期”，但续期是否免费、补缴基数按公示地价还是市场价，各地极易留下行政撕扯的空间。非70年出让性质的住宅，一律排除。

14. 要检查城市的历史地图，避免建造在昔日化工厂、农药厂、电镀厂、加油站、印染厂或老垃圾填埋场旧址上的小区。即便做过所谓的“土壤修复”，残留的有机挥发物（苯系物、三氯乙烯、氯仿）和重金属（铅、汞、砷）依然会通过地下气流和微孔隙源源不断渗透进低层住户室内。购买前必须去规划部门或环保局查该地块原有的“土地历史用途”。采空区：位于老矿区、地下暗河发育的喀斯特地貌区，或者过度开采地下水形成的地下采空区上方的小区。地表极易发生不均匀沉降，导致房屋倾斜、墙体贯穿性开裂。活动断裂带：紧贴断裂带带状区域建造的房屋，即便主体再坚固，一旦发生小震或地壳微动，房屋极易受到剪切破坏。建造在未经充分固结的填海区、吹填造陆区、鱼塘/河道填平地块上的房屋。不良开发商如果桩基没有打透到坚硬的基岩层（摩擦桩深度不够），房屋在建成5-10年后会出现严重的倾斜、地下室开裂倒灌、小区道路与主体建筑撕裂分离。紧贴220kV及以上高压输电线缆走廊或大型变电站。除了低频电磁场争议外，更直接的风险是高压线弧光放电、臭氧污染以及极端风暴下的倒塔风险，同时此类房产在二手市场上流动性极差。

21. 海砂房：未经过洗砂脱氯处理的未经处理海砂，氯离子极其严重地腐蚀钢筋，导致钢筋膨胀锈蚀、混凝土开裂脱落，楼体结构寿命直接折半，严重者10-15年即成危房。钢渣房：骨料中混入了未经过游离氧化钙（f-CaO）稳定化处理的游离钢渣。钢渣在后期遇水会发生剧烈体积膨胀，导致墙体、楼板内部像爆米花一样自内向外炸裂，这种物理破坏是不可逆且无法修复的。比海砂房更致命。早期（特别是1980—1990年代沿海地区）部分不良施工方直接抽取海水拌和混凝土。这种房屋整个骨架内部的氯离子含量极高，钢筋会在10-20年内彻底变成粉末，房屋承重结构随时会发生金蝉脱壳式的断裂崩溃。部分建材厂使用含硫量极高的劣质煤矸石制砖，如果烧结温度不够，砖体内部会残余大量高浓度的硫酸盐。一旦墙体受潮，硫酸盐结晶膨胀（俗称“盐霜爆裂”），不仅墙面粉刷层大量剥落，承重砖墙本身会逐渐粉碎化。1970—1980年代部分建筑为了追求快速凝固曾使用高铝水泥（High Alumina Cement）。这种水泥在常温潮湿环境下，晶型会发生转变（由六方晶系转化为立方晶系），导致混凝土强度在10-20年后下降40%-60%，结构极易发生无预警的脆性坍塌。某些利用工业废渣（如磷石膏、铝渣、某些高辐射矿渣）制成的加气混凝土砌块或空心砖，本身含有超标的镭-226、钍-232、钾-40等放射性核素。这类房屋会持续释放高浓度的氡气（一类致癌物），长期居住极易诱发肺癌与血液疾病。看房时如果用便携式辐射仪检测，γ辐射剂量率会明显高于本底值。部分劣质开发商在剪力墙或承重构件施工时，使用大量未清理的保温泡沫板、废木块、垃圾袋填塞混凝土模板（即“垃圾夹心墙”），甚至在二次结构填充墙中大量使用劣质泡沫砖。这种墙体不仅没有任何抗震和挂重能力，而且防火等级严重不达标。
