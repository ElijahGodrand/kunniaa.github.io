    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可

        const TITLE = '中学英语作文怎么提分';
        const CONTENT = `中学英语作文不理想，分数低，多是各种小错：时态混乱、单复数不分、句子之间没有连接。这些都是习惯问题，习惯问题只能靠短时间高频次的重复来纠正。

买几本句型转换专项训练，每天用五分钟到十分钟做几道题，做题时不能用词典笔，不准查词典，用铅笔做题，用铅笔在生词下划线标记。做完题，再用词典笔扫不认识的词，看看这个词什么意思。每道做错的题，用最大的声音，重复朗读填上正确答案的句子三遍，再脱稿说三遍。形成肌肉记忆。做错的题，把答案擦掉，把生词记到纸上。每天高频低量提问和回忆几个生词，循环记忆，每天重做前几天做错的题。做这个练习，直到句型转换持续一个星期不出错，可以暂停。

再往下，就是一个敢写和能写的问题。也要训练。**课本上的英语课文都是干巴巴的无趣的牛屎，伟光正，乏味的很，而且是中式英语，不正宗，毫无美感，恶心吧唧，不值得学，教的方法也不对，从写作训练的角度而言，一无是处**。

我们从历史上看看，英语作文写得好的人，是怎么练出来的。

**经济学家张五常**写过一篇文章《造短句的日子》聊过自己写英语作文的经验。

他认为，英文造句要从短句造起。英文的长句是由短句串连起来的。如果开始学就写长句，其结果不是左弯右曲，就是花拳绣腿，不可取也。先学几个字、几个字的短句，简单直写，但求清楚明白，熟练之后才把短句串连起来，其清晰与文气就有了根底。

一九五九年九月他进入了洛杉矶加州大学作本科生。他是外籍学生，校方规定要考外生英语试，决定哪些要补修不计学分的外生英语课程，哪些可以不补。三千多个外籍学生中他的成绩最差，要上不计学分的补课了。

需要补修的分很多班别，以上述的英语试的成绩高下来分派，他被安排在成绩最差的那一班。在此之前他读书的成绩奇差，已经二十三岁，比同学长几年，于是决定要真的读一下。那不计学分但算成绩的。

第一课之后，他去问老师，这个班要拿A容易吗？戴深近视眼镜的老头子老师回应：这英语成绩最差的一班我教了十多年，从来没有给过A，因为可以拿得A的学生不会分派到这班来。

近视老头子的教法前所未见，后无所闻。他教得非常用功，算成绩的计分方法奇特。十五个星期，每星期五节课，每课一个小时。每天课后老头子出一个文章题目，学生回家要写三百字，过一天要交出，再过一天他修改后就发还给学生。一篇三百字的习作以十为满分，错一处减一分，错十处或以上是零分，不论其他，而这些习作的分数加起来就是该科的最后成绩了。一班四十个学生，老头子每天改四十篇短文、记分，而还有其他班要教的，工作量很大。

......

全文五千两百字，见知识星球“昆尼Kunniaa” 。

我是昆尼Kunniaa，观察 · 思考 · 重构。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
