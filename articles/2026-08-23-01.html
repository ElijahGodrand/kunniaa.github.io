        const TITLE = '庄子是哲学版的游侠';
        const CONTENT = `一提到庄子，大致的印象是：一个在濠梁上看鱼、在濮水边钓鱼、对楚王派来的使者说"我宁可做一只在烂泥里拖着尾巴爬的乌龟"的隐士。一个逍遥的、避世的、不跟权力沾边的哲学家。一个用寓言讲故事、用故事讲道理、用道理消解一切严肃话题的聪明人。

庄子不仅仅如此，他还有一个极其重要的侧面——庄子不是文弱书生，大概率是一个具备实战能力、对刀剑搏杀有深刻理解的顶级剑客。他更像一个哲学版的游侠：既有那种看透人性缝隙、在乱世中顺势而为、不硬碰硬的生存智慧，又有那种不怕动手、能在近身搏杀中保持冷静的实战底气。

这个判断不是凭空猜的，是从《庄子》的两篇文字里读出来的：一篇是《养生主》里的庖丁解牛，另一篇是《说剑篇》。

庖丁为文惠君解牛，手按上去，肩膀倚住，脚踩稳当，膝盖顶住，刀进去的声音哗啦啦响，节奏合于桑林之舞，乃中经首之会。文惠君说：太好了，技术竟然能达到这种程度。庖丁放下刀说他追求的是道，不是技术。刚开始解牛的时候眼里是整头牛，三年之后眼里没有全牛了，只用精神去感知，不用眼睛去看，顺着牛身上的纹理走，劈开筋骨之间的空隙，刀沿着骨节之间的缝隙走，那些筋骨交错的地方刀根本不碰。好的屠夫一年换一把刀，因为硬砍；普通屠夫一个月换一把刀，因为硬剁；庖丁这把刀用了十九年，解过几千头牛，刀刃还像新的一样。骨节之间有缝隙，刀刃薄得没有厚度，用没有厚度的刀刃进入有缝隙的骨节，宽宽绰绰，游刃有余。文惠君听完说，听了庖丁的话，懂得了养生的道理。这道理就是，不硬砍，走缝隙，刀不坏，人也不坏。

这个故事，也写出了庄子本人对"切割"这件事的理解方式。**一个心理脆弱的人、一个把杀生当作禁忌的人，写不出这种文字**。庖丁解牛的描写里没有回避、遮掩、或道德负担。刀刃怎么走、筋怎么断、骨节之间的缝隙怎么找，都写成了节奏，写成了艺术。**庄子对宰牛的经验，不是站在远处看，是靠近了看、仔细看了、反复看了，而且观察的过程中没有不适感，反而有一种对结构和节奏的纯粹兴趣。能写出这种东西的人，至少说明他离屠宰场很近，离刀很近，离骨头的纹理很近，离死亡的现场很近，而且他不觉得这些东西需要被回避。他不是那种看杀生会痛苦的人，也不是那种需要靠"远庖厨"来保持心理清洁的人**。

庄子是宋国人。宋国是殷商的后裔，周王室允许宋国用“祖先之礼”进行祭祀，所以保留着相当多的商朝文化记忆。殷商有极重的鬼神信仰，杀生祭祀是日常生活的一部分，认为只有用最珍贵的祭品才能取悦神灵，商人祭天祭祖祭神的核心手段就是杀人，战俘、奴隶、甚至本族的人，都被当作祭品献上。舞者举着旌夏——那是一种用长矛挑着人头的旗帜——在鼓乐声中进入癫狂状态，模拟神灵附体后的劈砍动作。整个过程充满了血、恐惧和原始的狂热。晋悼公去宋国赴宴，宋国请晋悼公观看桑林之舞。舞师举着旌夏入场，晋悼公直接吓得躲进了房间。撤掉旌夏之后勉强看完了，回去的路上就病了。占卜的结果是：桑林之神显灵了。桑林之舞的恐怖程度，超出了现代人的想象。庄子知道桑林之舞是什么东西，知道商朝人是如何用活人祭天的。他写庖丁解牛的时候把刀声比作桑林之舞，说明他对杀生这件事没有道德障碍。他不是通过书本来了解桑林之舞的，是通过商朝后裔的文化记忆来理解它的。

......

全文六千字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
