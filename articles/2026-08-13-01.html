<body class="min-h-screen">

    <script>
        // ═══════════════════════════════════════=
        //  使用说明：改这两个变量即可
        // ═══════════════════════════════════════=
        const TITLE = '历史漫谈 | 十年战争，十年财富';
        const CONTENT = `孙子把战争分了四层：**上兵伐谋**，在棋盘上把对手算死；**其次伐交**，联合盟友、孤立敌人，不战而屈人之兵；**其次伐兵**，真刀真枪拼实力；**其下攻城**，硬啃堡垒，战死最多、收益最低。

四层里，越往上越靠脑子，越往下越靠拳头。

高明的统帅，少杀人，**多转化**：数年战争，把几百万俘虏转化成自己人，**杀掉一个俘虏是解决一个麻烦，转化却能增加一个资产。** 

转化靠**复合知识**，战争是全面的——经济是粮草，心理是士气，外交是联盟，技术是兵器。以战争为核心，无所不精，才是棋手。

刘邦取天下用了7年，刘秀12年，李渊是7年，朱元璋16年，平均下来，大致10年有大结果。

这10年最好的策略，是在旧战场上练兵、攒现金流，然后**创造一个新山头**。就像某逊，卖书10年，亏损了9年，然后开辟云计算，获得高利润。

全文六千七百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。

**每日必更**。`;
        // ═══════════════════════════════════════

        document.getElementById('article-title').textContent = TITLE;

        const contentDiv = document.getElementById('article-content');
        const paragraphs = CONTENT.split('\n\n');

        paragraphs.forEach(para => {
            const trimmed = para.trim();
            if (!trimmed) return;
            const p = document.createElement('p');
            p.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            contentDiv.appendChild(p);
        });
    </script>
