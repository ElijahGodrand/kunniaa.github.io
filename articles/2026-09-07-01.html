        const CONTENT = `**婚姻必然消失，从博弈论的角度来看，结论非常清楚。**

如果想要孩子呢？

上层男性想要孩子，有代孕、有信托、有法律隔离工具，完全绕开婚姻就能实现，马斯克跟4个女性生了14个孩子，Telegram创始人杜罗夫靠在不同国家有超过100个后代，徐波代孕100多个孩子。

中层男性面临的情况稍微复杂一点。他们也清楚婚姻很危险，离婚可能意味着半辈子积蓄被切割、长期抚养费、生活质量断崖式下跌。但他们有个难题：如果很想要孩子，以他们的经济实力，没有太多选择。他们需要找到一个愿意跟他生孩子的女性，而女方通常要求结婚作为前提。所以中层男性是被迫进场的，他们不得不用婚姻作为代价来换取后代。但这种婚姻稳定性存疑，风险什么时候爆发不确定，但爆发几乎是100%的——因为博弈结构本身就不稳定。

底层男性就比较简单了。他们当然也知道婚姻有风险，但反正没什么钱，想分也分不走多少。对于想跟他结婚的女性来说，从他身上薅不到什么羊毛，所以底层男性在婚姻市场上几乎没有竞争力。即使偶然结成了，婚姻也不会持续太久，能留下一个两个孩子已经算不错的结局。

所以从男性的角度，结论非常清晰：**如果他不想要孩子，完全不需要结婚**。现代社会提供了足够的娱乐、陪伴、生理满足的替代方案，花钱就能买到，不需要用婚姻这张高风险合同来绑定。

再看女性。女性的博弈逻辑有一个核心偏好：**绝大多数女性倾向于嫁给比自己更厉害、资源更丰富的男性。这个偏好不分阶层，贯穿始终**。

......

这些历史上的精英女性用行动证明了一件事：**当一个女性拥有足够的资源和选择的自由时，她不需要婚姻来定义自己的人生。**

这个现象背后，有两个重要的信号。

......

**既然男性和女性有了足够的资源，他们倾向于不生孩子、不要婚姻，或者不要婚姻但要孩子，再或者干脆什么都不要。那么有没有可能通过把他们的资源剥夺掉，让他们重新回到不得不相互依赖才能活下去的状态呢？**

不可能。这个答案非常确定。

......

全文九千六百字，星球见。

我是昆尼Kunniaa，观察 · 思考 · 重构。
